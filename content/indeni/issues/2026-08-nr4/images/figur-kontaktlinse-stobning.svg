<svg viewBox="0 0 920 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titel beskrivelse">
  <title id="titel">Støbetrinnet i fremstilling af en blød kontaktlinse</title>
  <desc id="beskrivelse">Fire trin: dosering i en formhalvdel, lukning med den anden formhalvdel, hærdning med varme og frigørelse før hydrering i saltvand.</desc>
  <defs>
    <marker id="pil" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#355b6d"/>
    </marker>
  </defs>
  <rect width="920" height="250" fill="#f5f5ef"/>
  <g font-family="Arial, sans-serif" fill="#18323d">
    <text x="42" y="32" font-size="18" font-weight="bold">1. Dosering</text>
    <path d="M55 145 Q120 105 185 145 L185 165 Q120 125 55 165 Z" fill="#9ac9d7" stroke="#355b6d" stroke-width="2"/>
    <path d="M105 92 C105 116 119 121 119 137" fill="none" stroke="#355b6d" stroke-width="3"/>
    <circle cx="105" cy="85" r="8" fill="#5b9db0"/>
    <text x="48" y="198" font-size="14">Formulering i hun-form</text>

    <line x1="205" y1="130" x2="260" y2="130" stroke="#355b6d" stroke-width="3" marker-end="url(#pil)"/>

    <text x="282" y="32" font-size="18" font-weight="bold">2. Lukning</text>
    <path d="M298 145 Q363 105 428 145 L428 165 Q363 125 298 165 Z" fill="#9ac9d7" stroke="#355b6d" stroke-width="2"/>
    <path d="M298 128 Q363 168 428 128 L428 112 Q363 152 298 112 Z" fill="#d9e5e8" stroke="#355b6d" stroke-width="2"/>
    <text x="302" y="198" font-size="14">Han- og hun-form mødes</text>

    <line x1="450" y1="130" x2="505" y2="130" stroke="#355b6d" stroke-width="3" marker-end="url(#pil)"/>

    <text x="526" y="32" font-size="18" font-weight="bold">3. Hærdning</text>
    <rect x="538" y="82" width="130" height="92" rx="10" fill="#f0bf75" stroke="#9b6422" stroke-width="2"/>
    <path d="M565 132 Q603 108 641 132" fill="none" stroke="#355b6d" stroke-width="5"/>
    <path d="M567 61 C553 75 578 78 564 94 M602 61 C588 75 613 78 599 94 M637 61 C623 75 648 78 634 94" fill="none" stroke="#c55b34" stroke-width="4"/>
    <text x="547" y="198" font-size="14">Varme binder netværket</text>

    <line x1="686" y1="130" x2="741" y2="130" stroke="#355b6d" stroke-width="3" marker-end="url(#pil)"/>

    <text x="738" y="32" font-size="18" font-weight="bold">4. Hydrering</text>
    <path d="M754 103 L834 103 L824 181 L764 181 Z" fill="#a8d6e2" stroke="#355b6d" stroke-width="2"/>
    <path d="M774 137 Q794 119 814 137 Q794 155 774 137 Z" fill="#eef7f8" stroke="#355b6d" stroke-width="2"/>
    <text x="748" y="208" font-size="14">Saltvandsopløsning</text>
  </g>
</svg>
