<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" style="background-color: #fcfcfc; border: 1px solid #d1d5db; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
  </defs>

  <text x="30" y="35" font-size="18" font-weight="bold" fill="#111827">KØLEKREDSEN: FIRE TRIN, DER FLYTTER VARMEN</text>
  <text x="30" y="55" font-size="12" fill="#6b7280">Inde i skabet er trykket lavt og temperaturen lav — udenfor er det omvendt</text>

  <!-- Trin 1: Fordamper -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">1. Fordamper</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1e3a8a">Lavt tryk:</text>
    <text x="90" y="63" font-size="11" text-anchor="middle" fill="#1e3a8a">kølemidlet koger</text>
    <text x="90" y="78" font-size="11" text-anchor="middle" fill="#1e3a8a">og optager varme</text>
    <text x="90" y="93" font-size="11" text-anchor="middle" fill="#1e3a8a">fra skabet</text>
    <rect x="25" y="100" width="130" height="22" rx="4" fill="#1e40af"/>
    <text x="90" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Koldt, lavt tryk</text>
  </g>

  <path d="M 215 165 L 265 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trin 2: Kompressor -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="150" height="130" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="75" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">2. Kompressor</text>
    <text x="75" y="48" font-size="11" text-anchor="middle" fill="#78350f">Presser gassen</text>
    <text x="75" y="63" font-size="11" text-anchor="middle" fill="#78350f">sammen — tryk</text>
    <text x="75" y="78" font-size="11" text-anchor="middle" fill="#78350f">og temperatur</text>
    <text x="75" y="93" font-size="11" text-anchor="middle" fill="#78350f">stiger</text>
    <rect x="15" y="100" width="120" height="22" rx="4" fill="#b45309"/>
    <text x="75" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Bruger strøm</text>
  </g>

  <path d="M 425 165 L 475 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trin 3: Kondensator -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">3. Kondensator</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#7f1d1d">Højt tryk: gassen</text>
    <text x="90" y="63" font-size="11" text-anchor="middle" fill="#7f1d1d">kondenserer og</text>
    <text x="90" y="78" font-size="11" text-anchor="middle" fill="#7f1d1d">afgiver varme til</text>
    <text x="90" y="93" font-size="11" text-anchor="middle" fill="#7f1d1d">køkkenet</text>
    <rect x="25" y="100" width="130" height="22" rx="4" fill="#991b1b"/>
    <text x="90" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Varmt, højt tryk</text>
  </g>

  <path d="M 665 165 L 715 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trin 4: Ekspansionsventil -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="150" height="130" rx="8" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2"/>
    <text x="75" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#581c87">4. Ventil</text>
    <text x="75" y="48" font-size="11" text-anchor="middle" fill="#581c87">Snæver passage:</text>
    <text x="75" y="63" font-size="11" text-anchor="middle" fill="#581c87">trykket falder</text>
    <text x="75" y="78" font-size="11" text-anchor="middle" fill="#581c87">brat — midlet</text>
    <text x="75" y="93" font-size="11" text-anchor="middle" fill="#581c87">bliver koldt</text>
    <rect x="15" y="100" width="120" height="22" rx="4" fill="#6b21a8"/>
    <text x="75" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Kapillarrør</text>
  </g>

  <!-- Returpile -->
  <path d="M 795 230 L 795 270 L 120 270 L 120 235" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="290" font-size="11" text-anchor="middle" fill="#4b5563">Kold væske-gas-blanding retur til fordamperen — kredsløbet starter forfra</text>

  <!-- Kølemiddel-note -->
  <rect x="30" y="305" width="840" height="55" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <text x="50" y="327" font-size="12" fill="#14532d">Kølemidlet i nye skabe er næsten altid isobutan (R600a, GWP ca. 3) — mod ældre R134a (GWP 1.430).</text>
  <text x="50" y="345" font-size="12" fill="#14532d">Samme maskine, langt mindre klimabelastning ved lækage. Fyldning: omkring 100 gram eller mindre.</text>

  <text x="30" y="390" font-size="10" fill="#9ca3af">Egenproduceret diagram, INDENI nr. 6. GWP-tal: IPCC AR5, kapitel 8; regulering: forordning (EU) 2024/573.</text>
</svg>
