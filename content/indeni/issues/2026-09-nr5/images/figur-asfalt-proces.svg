<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" style="background-color: #fcfcfc; border: 1px solid #d1d5db; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
  </defs>

  <text x="30" y="35" font-size="18" font-weight="bold" fill="#111827">ASFALTVÆRKET: FRA TØR STEN TIL FÆRDIG VEJ</text>
  <text x="30" y="55" font-size="12" fill="#6b7280">Tre trin, tre temperaturer — varmen falder hele vejen til vejen</text>

  <!-- Trin 1: Tørretromle -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="90" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Tørretromle</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#78350f">Tilslag (sten,</text>
    <text x="90" y="65" font-size="11" text-anchor="middle" fill="#78350f">grus, sand)</text>
    <text x="90" y="85" font-size="11" text-anchor="middle" fill="#78350f">tørres, al fugt</text>
    <text x="90" y="100" font-size="11" text-anchor="middle" fill="#78350f">fjernes</text>
    <rect x="30" y="105" width="120" height="22" rx="4" fill="#b45309"/>
    <text x="90" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">145-160°C</text>
  </g>

  <path d="M 225 160 L 275 160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bitumen sidebranch -->
  <g transform="translate(285, 55)">
    <rect x="0" y="0" width="140" height="30" rx="6" fill="#1f2937"/>
    <text x="70" y="13" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">Bitumen opvarmes</text>
    <text x="70" y="25" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbbf24">155-160°C</text>
  </g>
  <path d="M 355 85 L 355 100" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trin 2: Blander -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>
    <text x="90" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Blander</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#7f1d1d">Varmt tilslag +</text>
    <text x="90" y="65" font-size="11" text-anchor="middle" fill="#7f1d1d">flydende bitumen</text>
    <text x="90" y="85" font-size="11" text-anchor="middle" fill="#7f1d1d">blandes til varm</text>
    <text x="90" y="100" font-size="11" text-anchor="middle" fill="#7f1d1d">asfalt</text>
    <rect x="30" y="105" width="120" height="22" rx="4" fill="#991b1b"/>
    <text x="90" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">150-190°C</text>
  </g>

  <path d="M 465 160 L 515 160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trin 3: Udlægning -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <text x="90" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Udlægningsmaskine</text>
    <text x="90" y="50" font-size="11" text-anchor="middle" fill="#1e3a8a">Asfalt fordeles i</text>
    <text x="90" y="65" font-size="11" text-anchor="middle" fill="#1e3a8a">et jævnt lag,</text>
    <text x="90" y="85" font-size="11" text-anchor="middle" fill="#1e3a8a">tromler presser</text>
    <text x="90" y="100" font-size="11" text-anchor="middle" fill="#1e3a8a">laget tæt</text>
    <rect x="30" y="105" width="120" height="22" rx="4" fill="#1e40af"/>
    <text x="90" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">130-160°C</text>
  </g>

  <!-- WMA note -->
  <rect x="40" y="260" width="660" height="55" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <text x="60" y="282" font-size="12" fill="#14532d">Warm Mix Asphalt (WMA, lavtemperaturasfalt): samme tre trin, men ved lavere</text>
  <text x="60" y="300" font-size="12" fill="#14532d">temperatur (ca. 130°C) — udgjorde 14,6 % af den europæiske produktion i 2024.</text>

  <text x="40" y="345" font-size="10" fill="#9ca3af">Kilde: EAPA, "Asphalt in Figures 2024"; Rubio m.fl., "Warm mix asphalt: an overview", Journal of Cleaner Production, 2012.</text>
</svg>
