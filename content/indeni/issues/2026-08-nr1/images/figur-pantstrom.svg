<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">En dansk dåses vej gennem pantsystemet</title>
  <desc id="desc">Procesdiagram fra hjem og pantautomat over optælling og balning til aluminiumssortering og omsmeltning.</desc>
  <style>.bg{fill:#071c2c}.card{fill:#102c3e;stroke:#2f5060;stroke-width:2}.mint{fill:#94c9be}.orange{fill:#e88d45}.line{stroke:#94c9be;stroke-width:8;fill:none;marker-end:url(#a)}text{font-family:Arial,sans-serif;fill:#f5f5ef}.h{font-size:29px;font-weight:bold}.s{font-size:18px;fill:#d7e8e4}.n{font-size:18px;font-weight:bold;fill:#071c2c}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#94c9be"/></marker></defs>
  <rect class="bg" width="1200" height="700" rx="24"/><text x="60" y="70" class="h">Pantens lange bane</text><text x="60" y="102" class="s">Pantautomaten genkender emballagen; resten er sortering og logistik.</text>
  <path class="line" d="M190 330H260M430 330H500M670 330H740M910 330H980"/>
  <g transform="translate(45 190)"><rect class="card" width="145" height="280" rx="18"/><circle cx="28" cy="30" r="16" class="orange"/><text x="23" y="36" class="n">1</text><text x="24" y="83" class="h">Hjem</text><path d="M50 148l23-30 23 30v54H50z" class="mint"/><rect x="70" y="155" width="12" height="47" fill="#071c2c"/><text x="24" y="235" class="s">Den tomme dåse</text><text x="24" y="260" class="s">beholder sin pant.</text></g>
  <g transform="translate(285 190)"><rect class="card" width="145" height="280" rx="18"/><circle cx="28" cy="30" r="16" class="orange"/><text x="23" y="36" class="n">2</text><text x="24" y="83" class="h">Automat</text><rect x="40" y="123" width="66" height="110" rx="8" class="mint"/><circle cx="73" cy="155" r="19" class="bg"/><path d="M60 203h26" stroke="#071c2c" stroke-width="7"/><text x="24" y="260" class="s">Type og pantværdi</text><text x="24" y="285" class="s">aflæses.</text></g>
  <g transform="translate(525 190)"><rect class="card" width="145" height="280" rx="18"/><circle cx="28" cy="30" r="16" class="orange"/><text x="23" y="36" class="n">3</text><text x="24" y="83" class="h">Sortering</text><path d="M42 138h62v22H42zM50 160h46v28H50zM56 188h34v32H56z" class="mint"/><text x="24" y="260" class="s">Materialer holdes</text><text x="24" y="285" class="s">adskilt.</text></g>
  <g transform="translate(765 190)"><rect class="card" width="145" height="280" rx="18"/><circle cx="28" cy="30" r="16" class="orange"/><text x="23" y="36" class="n">4</text><text x="24" y="83" class="h">Baller</text><rect x="40" y="145" width="65" height="57" rx="5" class="mint"/><path d="M47 160h51M47 178h51M47 196h51" stroke="#071c2c" stroke-width="5"/><text x="24" y="260" class="s">Dåser presses til</text><text x="24" y="285" class="s">transportable baller.</text></g>
<g transform="translate(1005 190)"><rect class="card" width="145" height="280" rx="18"/><circle cx="28" cy="30" r="16" class="orange"/><text x="23" y="36" class="n">5</text><text x="24" y="83" class="h">Næste led</text><path d="M45 144h58v72H45z" class="mint"/><path d="M56 161h36M56 181h36" stroke="#071c2c" stroke-width="7"/><text x="24" y="260" class="s">Sælges videre til</text><text x="24" y="285" class="s">sortering/omsmeltning.</text></g>
  <text x="60" y="590" class="s">2,2 mia. flasker og dåser blev afleveret i Dansk Retursystem i 2025. Tallet er for hele pantsystemet, ikke kun aluminium. </text><text x="60" y="625" class="s">Kilde: Dansk Retursystem, Årsrapport 2025. INDENI · nr. 1</text>
</svg>
