<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fra aluminiumstrimmel til todelt drikkedåse</title>
  <desc id="desc">Et procesdiagram i fem trin: aluminiumstrimmel, rund skive, kop, høj dåsekrop og færdig dåse med separat top.</desc>
  <style>
    .bg { fill:#f5f5ef } .panel { fill:#fff; stroke:#d8e1dd; stroke-width:2 } .metal { fill:#bcc7c5; stroke:#58716d; stroke-width:3 } .dark { fill:#071c2c } .mint { fill:#94c9be } .orange { fill:#e88d45 } .arrow { stroke:#94c9be; stroke-width:10; fill:none; stroke-linecap:round; marker-end:url(#arrow) } text { font-family:Arial,sans-serif; fill:#071c2c } .n { font-size:18px; font-weight:bold; fill:#e88d45 } .h { font-size:24px; font-weight:bold } .s { font-size:17px; fill:#3c5654 }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94c9be"/></marker></defs>
  <rect class="bg" width="1200" height="700" rx="24"/>
  <text x="60" y="70" class="h">Sådan bliver en todelt dåse formet</text>
  <text x="60" y="102" class="s">Kroppen trækkes af én skive metal. Top og fane monteres senere.</text>
  <path class="arrow" d="M230 355 H292"/><path class="arrow" d="M464 355 H526"/><path class="arrow" d="M698 355 H760"/><path class="arrow" d="M932 355 H994"/>
  <g transform="translate(45 170)"><rect class="panel" width="185" height="390" rx="18"/><circle cx="28" cy="34" r="16" class="orange"/><text x="23" y="40" class="n">1</text><text x="28" y="82" class="h">Strimmel</text><rect x="28" y="190" width="130" height="82" rx="8" class="metal"/><path d="M42 212h102M42 232h102M42 252h102" stroke="#e9efed" stroke-width="6"/><text x="28" y="320" class="s">Valsede plader</text><text x="28" y="345" class="s">kommer i ruller.</text></g>
  <g transform="translate(279 170)"><rect class="panel" width="185" height="390" rx="18"/><circle cx="28" cy="34" r="16" class="orange"/><text x="23" y="40" class="n">2</text><text x="28" y="82" class="h">Skive</text><circle cx="93" cy="230" r="62" class="metal"/><circle cx="93" cy="230" r="43" fill="none" stroke="#e9efed" stroke-width="5"/><text x="28" y="320" class="s">Et værktøj stanser</text><text x="28" y="345" class="s">en rund blank ud.</text></g>
  <g transform="translate(513 170)"><rect class="panel" width="185" height="390" rx="18"/><circle cx="28" cy="34" r="16" class="orange"/><text x="23" y="40" class="n">3</text><text x="28" y="82" class="h">Kop</text><path d="M48 171h92l-13 126q-2 22-34 22H95q-32 0-34-22z" class="metal"/><ellipse cx="94" cy="171" rx="46" ry="13" fill="#e9efed" stroke="#58716d" stroke-width="3"/><text x="28" y="352" class="s">Skiven trækkes ned</text><text x="28" y="377" class="s">til en lav kop.</text></g>
  <g transform="translate(747 170)"><rect class="panel" width="185" height="390" rx="18"/><circle cx="28" cy="34" r="16" class="orange"/><text x="23" y="40" class="n">4</text><text x="28" y="82" class="h">Krop</text><path d="M53 147h82l-11 193q-2 22-30 22H94q-28 0-30-22z" class="metal"/><ellipse cx="94" cy="147" rx="41" ry="12" fill="#e9efed" stroke="#58716d" stroke-width="3"/><path d="M62 202h64M60 245h68M57 288h74" stroke="#e9efed" stroke-width="5"/><text x="28" y="385" class="s">Væggen stryges tynd</text><text x="28" y="410" class="s">og trimmes i højden.</text></g>
  <g transform="translate(981 170)"><rect class="panel" width="185" height="390" rx="18"/><circle cx="28" cy="34" r="16" class="orange"/><text x="23" y="40" class="n">5</text><text x="28" y="82" class="h">Fyld &amp; top</text><path d="M54 160h78l-10 177q-2 20-29 20H93q-27 0-29-20z" class="metal"/><ellipse cx="93" cy="160" rx="39" ry="12" class="dark"/><path d="M72 160q21-15 42 0" fill="none" stroke="#94c9be" stroke-width="5"/><path d="M69 145h48" stroke="#e88d45" stroke-width="9" stroke-linecap="round"/><text x="28" y="385" class="s">Drikken fyldes,</text><text x="28" y="410" class="s">så lukkes toppen.</text></g>
  <text x="60" y="640" class="s">Forenklet proces: fabrikker varierer i værktøj, rækkefølge og kontroltrin. INDENI · nr. 1</text>
</svg>
