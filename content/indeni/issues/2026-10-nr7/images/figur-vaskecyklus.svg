<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" style="background-color: #fcfcfc; border: 1px solid #d1d5db; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
  </defs>

  <text x="30" y="35" font-size="18" font-weight="bold" fill="#111827">VASKECYKLUS: FIRE TRIN, DER FLYTTER SNAVS OG VAND</text>
  <text x="30" y="55" font-size="12" fill="#6b7280">Koldt vand ind — varme, mekanik og skyl — vand og restfugt ud</text>

  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">1. Indløb + varme</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#1e3a8a">Koldt vand ind</text>
    <text x="90" y="63" font-size="11" text-anchor="middle" fill="#1e3a8a">via indløbsventil</text>
    <text x="90" y="78" font-size="11" text-anchor="middle" fill="#1e3a8a">Vaskemiddel opløses</text>
    <text x="90" y="93" font-size="11" text-anchor="middle" fill="#1e3a8a">Elementet varmer</text>
    <rect x="25" y="100" width="130" height="22" rx="4" fill="#1e40af"/>
    <text x="90" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Bruger strøm</text>
  </g>

  <path d="M 215 165 L 265 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">2. Tromle + lifters</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#78350f">Reversibel drejning</text>
    <text x="90" y="63" font-size="11" text-anchor="middle" fill="#78350f">Lifters løfter tøjet</text>
    <text x="90" y="78" font-size="11" text-anchor="middle" fill="#78350f">og slipper det i</text>
    <text x="90" y="93" font-size="11" text-anchor="middle" fill="#78350f">vaskebadet</text>
    <rect x="25" y="100" width="130" height="22" rx="4" fill="#b45309"/>
    <text x="90" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Mekanik</text>
  </g>

  <path d="M 455 165 L 505 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
    <text x="90" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#064e3b">3. Pumpe + skyl</text>
    <text x="90" y="48" font-size="11" text-anchor="middle" fill="#064e3b">Afløbspumpe tømmer</text>
    <text x="90" y="63" font-size="11" text-anchor="middle" fill="#064e3b">vaskebadet</text>
    <text x="90" y="78" font-size="11" text-anchor="middle" fill="#064e3b">Rent vand ind</text>
    <text x="90" y="93" font-size="11" text-anchor="middle" fill="#064e3b">en eller flere gange</text>
    <rect x="25" y="100" width="130" height="22" rx="4" fill="#047857"/>
    <text x="90" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Vand ud / ind</text>
  </g>

  <path d="M 695 165 L 745 165" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="120" height="130" rx="8" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2"/>
    <text x="60" y="28" font-size="13" font-weight="bold" text-anchor="middle" fill="#581c87">4. Spin</text>
    <text x="60" y="48" font-size="11" text-anchor="middle" fill="#581c87">Op til ca.</text>
    <text x="60" y="63" font-size="11" text-anchor="middle" fill="#581c87">1.600 o/min</text>
    <text x="60" y="78" font-size="11" text-anchor="middle" fill="#581c87">presser vand</text>
    <text x="60" y="93" font-size="11" text-anchor="middle" fill="#581c87">ud af tøjet</text>
    <rect x="10" y="100" width="100" height="22" rx="4" fill="#6b21a8"/>
    <text x="60" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Restfugt ned</text>
  </g>

  <path d="M 810 230 L 810 270 L 120 270 L 120 235" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="290" font-size="11" text-anchor="middle" fill="#4b5563">Tætningslisten holder vandet inde, mens tromlen bevæger sig — cyklusen kan gentage skyl</text>

  <rect x="30" y="305" width="840" height="55" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <text x="50" y="327" font-size="12" fill="#14532d">Energimærket i EU (A–G) måler økoprogrammet eco 40-60 — ikke de hurtige programmer.</text>
  <text x="50" y="345" font-size="12" fill="#14532d">Ecodesign kræver desuden reservedele og serviceoplysninger i op til 10 år efter sidste salg.</text>

  <text x="30" y="390" font-size="10" fill="#9ca3af">Egenproduceret diagram, INDENI nr. 7. Regler: forordning (EU) 2019/2023 og (EU) 2019/2022.</text>
</svg>
