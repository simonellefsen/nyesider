<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Fra fibre til kaffefilter</title>
  <desc id="desc">Procesdiagram: pulp, ark, skæring, pakket filter, brugt filter til affald eller organisk fraktion.</desc>
  <style>
    .bg{fill:#f5f5ef}.card{fill:#fff;stroke:#d8e1dd;stroke-width:2}
    .mint{fill:#94c9be}.orange{fill:#e88d45}.ink{fill:#071c2c}
    text{font-family:Arial,sans-serif;fill:#071c2c}
    .h{font-size:26px;font-weight:bold}.s{font-size:16px;fill:#3c5654}.n{font-size:18px;font-weight:bold;fill:#e88d45}
    .arrow{stroke:#94c9be;stroke-width:8;fill:none;stroke-linecap:round;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#94c9be"/></marker></defs>
  <rect class="bg" width="1200" height="480" rx="20"/>
  <text x="48" y="52" class="h">Fra fibre til filter (forenklet)</text>
  <text x="48" y="82" class="s">Pile viser typisk rækkefølge — ikke hvert rør, hver sensor eller hvert tab.</text>
  <g transform="translate(60,140)">
    <rect class="card" width="180" height="160" rx="12"/><text x="20" y="40" class="n">1</text><text x="20" y="80" class="h" font-size="20">Pulp</text><text x="20" y="110" class="s">Fibre + vand</text>
  </g>
  <path class="arrow" d="M250 220 H300"/>
  <g transform="translate(310,140)">
    <rect class="card" width="180" height="160" rx="12"/><text x="20" y="40" class="n">2</text><text x="20" y="80" class="h" font-size="20">Ark</text><text x="20" y="110" class="s">Tørring</text>
  </g>
  <path class="arrow" d="M500 220 H550"/>
  <g transform="translate(560,140)">
    <rect class="card" width="180" height="160" rx="12"/><text x="20" y="40" class="n">3</text><text x="20" y="80" class="h" font-size="20">Skær</text><text x="20" y="110" class="s">Filterform</text>
  </g>
  <path class="arrow" d="M750 220 H800"/>
  <g transform="translate(810,140)">
    <rect class="card" width="180" height="160" rx="12"/><text x="20" y="40" class="n">4</text><text x="20" y="80" class="h" font-size="20">Pakk</text><text x="20" y="110" class="s">Butik / hjem</text>
  </g>
  <path class="arrow" d="M1000 220 H1040"/>
  <g transform="translate(1045,160)">
    <circle class="orange" cx="40" cy="60" r="36"/><text x="22" y="66" fill="#fff" font-size="14" font-weight="bold">brug</text>
  </g>
  <text x="48" y="420" class="s">Orange prik: brugen er start — ikke slut. Affaldsvej afhænger af kommune og om filteret er rent papir eller blandet med grums/plast.</text>
</svg>
