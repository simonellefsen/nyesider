<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" style="background-color: #fcfcfc; border: 1px solid #d1d5db; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
  </defs>

  <text x="30" y="35" font-size="18" font-weight="bold" fill="#071C2C">LUFTVEJ: FEM TRIN FRA GULV TIL UDBLÆSNING</text>
  <text x="30" y="55" font-size="12" fill="#6b7280">Støv ind — adskillelse — motor på renluft-siden — finfilter — luft ud</text>

  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#e8f4f1" stroke="#071C2C" stroke-width="2"/>
    <text x="75" y="32" font-size="13" font-weight="bold" text-anchor="middle" fill="#071C2C">1. Indløbsdyse</text>
    <text x="75" y="58" font-size="11" text-anchor="middle" fill="#071C2C">Børste og luft</text>
    <text x="75" y="76" font-size="11" text-anchor="middle" fill="#071C2C">river snavs løs</text>
    <text x="75" y="94" font-size="11" text-anchor="middle" fill="#071C2C">fra gulv og slange</text>
  </g>

  <path d="M 178 180 L 218 180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(226, 110)">
    <rect x="0" y="0" width="160" height="140" rx="8" fill="#fde8d6" stroke="#E88D45" stroke-width="2"/>
    <text x="80" y="32" font-size="13" font-weight="bold" text-anchor="middle" fill="#071C2C">2. Pose / cyklon</text>
    <text x="80" y="58" font-size="11" text-anchor="middle" fill="#071C2C">Pose: beholder</text>
    <text x="80" y="76" font-size="11" text-anchor="middle" fill="#071C2C">og filter i ét</text>
    <text x="80" y="94" font-size="11" text-anchor="middle" fill="#071C2C">Cyklon: slynge</text>
    <text x="80" y="112" font-size="11" text-anchor="middle" fill="#071C2C">større partikler ud</text>
  </g>

  <path d="M 394 180 L 434 180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(442, 110)">
    <rect x="0" y="0" width="140" height="140" rx="8" fill="#d7ebe6" stroke="#94C9BE" stroke-width="2"/>
    <text x="70" y="32" font-size="13" font-weight="bold" text-anchor="middle" fill="#071C2C">3. Motor</text>
    <text x="70" y="58" font-size="11" text-anchor="middle" fill="#071C2C">Renluft-side i</text>
    <text x="70" y="76" font-size="11" text-anchor="middle" fill="#071C2C">de fleste pose-</text>
    <text x="70" y="94" font-size="11" text-anchor="middle" fill="#071C2C">maskiner</text>
  </g>

  <path d="M 590 180 L 630 180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(638, 110)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#edf3f5" stroke="#071C2C" stroke-width="2"/>
    <text x="75" y="32" font-size="13" font-weight="bold" text-anchor="middle" fill="#071C2C">4. Filtre</text>
    <text x="75" y="58" font-size="11" text-anchor="middle" fill="#071C2C">Motorfilter</text>
    <text x="75" y="76" font-size="11" text-anchor="middle" fill="#071C2C">plus HEPA</text>
    <text x="75" y="94" font-size="11" text-anchor="middle" fill="#071C2C">(EN 1822)</text>
  </g>

  <path d="M 796 180 L 836 180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(844, 130)">
    <rect x="0" y="0" width="40" height="100" rx="8" fill="#071C2C"/>
    <text x="20" y="42" font-size="12" font-weight="bold" text-anchor="middle" fill="#fcfcfc">Ud</text>
    <text x="20" y="62" font-size="11" text-anchor="middle" fill="#94C9BE">luft</text>
  </g>

  <text x="30" y="300" font-size="13" font-weight="bold" fill="#071C2C">Hvad reglerne sætter tal på</text>
  <text x="30" y="324" font-size="12" fill="#374151">Fra 1. sep. 2014: max 1.600 W / 62 kWh/år. Fra 1. sep. 2017: max 900 W / 43 kWh/år, støvudstødning 1,00 %, 80 dB(A).</text>
  <text x="30" y="346" font-size="12" fill="#374151">Motorlevetid mindst 500 timer. Slangen skal holde til 40.000 sving under belastning. Watt er optagen effekt — ikke renseevne alene.</text>
  <text x="30" y="380" font-size="12" fill="#6b7280">Kilde: forordning (EU) nr. 666/2013. Diagram: INDENI-redaktionen.</text>
</svg>
