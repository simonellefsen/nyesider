<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background-color: #fcfcfc; border: 1px solid #d1d5db; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <text x="30" y="40" font-size="20" font-weight="bold" fill="#111827">THEMIS-DEMONSTRATOREN: SKALA &amp; LOGISTIK</text>
  <text x="30" y="60" font-size="12" fill="#6b7280">Europas første testplatform for genbrugelige raket-førstetrin</text>

  <g transform="translate(80, 100)">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#9ca3af" stroke-width="2" />
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#9ca3af" stroke-width="2" />
    <line x1="-5" y1="300" x2="5" y2="300" stroke="#9ca3af" stroke-width="2" />
    <text x="-15" y="155" font-size="14" font-weight="bold" fill="#4b5563" transform="rotate(-90, -15, 155)" text-anchor="middle">30 METER</text>

    <rect x="40" y="0" width="45" height="260" rx="4" fill="#d1d5db" stroke="#4b5563" stroke-width="2" />
    <path d="M 40 40 L 85 40 M 40 80 L 85 80 M 40 220 L 85 220" stroke="#9ca3af" stroke-width="1" />

    <path d="M 50 260 L 75 260 L 80 285 L 45 285 Z" fill="#6b7280" stroke="#4b5563" stroke-width="2" />

    <path d="M 40 200 L 15 295 L 30 300 L 40 240 Z" fill="#374151" />
    <path d="M 85 200 L 110 295 L 95 300 L 85 240 Z" fill="#374151" />

    <rect x="140" y="282" width="6" height="18" fill="#1f2937" />
    <circle cx="143" cy="278" r="4" fill="#1f2937" />
    <text x="130" y="315" font-size="10" fill="#4b5563">Menneske</text>

    <text x="100" y="25" font-size="12" fill="#1f2937" font-weight="bold">Struktur (Tanke)</text>
    <line x1="85" y1="20" x2="95" y2="20" stroke="#1f2937" stroke-width="1" />

    <text x="140" y="230" font-size="12" fill="#1f2937" font-weight="bold">Kulfiber-landingsben</text>
    <text x="140" y="245" font-size="10" fill="#4b5563">(Connova, CH)</text>
    <line x1="100" y1="240" x2="135" y2="240" stroke="#1f2937" stroke-width="1" />

    <text x="140" y="280" font-size="12" fill="#1f2937" font-weight="bold">Prometheus-motor</text>
    <text x="140" y="295" font-size="10" fill="#4b5563">~100 tons trykkraft</text>
    <line x1="80" y1="275" x2="135" y2="275" stroke="#1f2937" stroke-width="1" />
  </g>

  <line x1="380" y1="80" x2="380" y2="400" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6" />

  <g transform="translate(420, 100)">
    <text x="0" y="10" font-size="14" font-weight="bold" fill="#111827">LOGISTIK: 3.000 KM TRANSPORT (2025)</text>

    <path d="M 50 250 L 100 220 L 130 250 L 110 300 L 50 290 Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1" />
    <path d="M 130 180 L 170 160 L 220 50 L 240 10 L 260 20 L 220 150 L 200 200 L 160 210 Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1" />

    <circle cx="90" cy="240" r="6" fill="#ef4444" />
    <text x="70" y="260" font-size="12" font-weight="bold" fill="#111827">Frankrig</text>
    <text x="70" y="275" font-size="10" fill="#4b5563">Produktion</text>

    <circle cx="240" cy="40" r="6" fill="#3b82f6" />
    <text x="170" y="30" font-size="12" font-weight="bold" fill="#111827">Esrange, Sverige</text>
    <text x="150" y="45" font-size="10" fill="#4b5563">SSC Space testsite</text>

    <path d="M 95 235 C 130 150, 180 100, 235 45" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrow)" />

    <rect x="140" y="120" width="80" height="24" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1" />
    <text x="180" y="136" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">3.000 km</text>

    <rect x="0" y="300" width="350" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="10" y="325" font-size="11" fill="#1e3a8a">Milepæl: 23. juli 2026 - Fuld "wet dress rehearsal" ved -200°C</text>
  </g>
</svg>
