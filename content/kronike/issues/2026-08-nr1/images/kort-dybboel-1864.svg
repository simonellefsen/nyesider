<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Kort: Dannevirke, Dybbøl og Sønderborg 1864">
  <rect width="400" height="420" fill="#F7F1E6"/>
  <text x="14" y="26" font-family="Georgia, serif" font-size="13" fill="#1C1410" font-weight="700">1864: fra Dannevirke til Dybbøl</text>
  <text x="14" y="42" font-family="system-ui,sans-serif" font-size="9" fill="#5A4A3A">Skematisk — afstande ikke i skala</text>
  <!-- land mass south jutland / als -->
  <path d="M60 80 L180 70 L220 120 L240 200 L200 280 L120 300 L70 240 L55 150 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1.2"/>
  <path d="M240 160 L320 150 L350 200 L330 280 L260 290 L240 220 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1.2"/>
  <!-- water Alssund / Flensborg Fjord area -->
  <path d="M200 200 L250 210 L260 280 L210 290 L190 250 Z" fill="#6A9EAE" opacity="0.75"/>
  <text x="210" y="250" font-family="system-ui,sans-serif" font-size="8" fill="#0A2A35">Als</text>
  <!-- Dannevirke south -->
  <line x1="70" y1="320" x2="200" y2="310" stroke="#1C1410" stroke-width="5" stroke-linecap="round"/>
  <text x="75" y="345" font-family="system-ui,sans-serif" font-size="11" fill="#1C1410" font-weight="700">Dannevirke</text>
  <text x="75" y="358" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">rømmet 5.–6. feb. 1864</text>
  <!-- Dybbøl -->
  <circle cx="230" cy="230" r="7" fill="#8B3A3A"/>
  <text x="242" y="228" font-family="system-ui,sans-serif" font-size="12" fill="#8B3A3A" font-weight="700">Dybbøl</text>
  <text x="242" y="240" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">skanser · møllen</text>
  <!-- Sønderborg -->
  <circle cx="280" cy="235" r="4" fill="#A67C52"/>
  <text x="288" y="238" font-family="system-ui,sans-serif" font-size="9" fill="#A67C52">Sønderborg</text>
  <!-- retreat arrow -->
  <path d="M150 300 L200 260" stroke="#8B3A3A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8B3A3A"/>
    </marker>
  </defs>
  <text x="155" y="275" font-family="system-ui,sans-serif" font-size="9" fill="#8B3A3A">tilbagetog</text>
  <text x="14" y="400" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">KRØNIKE · skitskort (SVG)</text>
</svg>
