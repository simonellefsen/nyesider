<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Kort: Hedeby, Slien og Dannevirke i forhold til nutidens Danmark">
  <rect width="420" height="520" fill="#F7F1E6"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="14" fill="#1C1410" font-weight="700">Sydjylland · vikingetidens knudepunkt</text>
  <text x="16" y="46" font-family="system-ui,sans-serif" font-size="10" fill="#5A4A3A">Skematisk — ikke opmålt kort. Nutidens grænse indikeret.</text>
  <!-- Jutland peninsula simplified -->
  <path d="M180 70 L210 90 L230 140 L250 200 L260 280 L255 340 L240 400 L200 460 L160 470 L130 420 L120 340 L125 260 L140 180 L155 110 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1.5"/>
  <!-- water: Baltic/east and North Sea/west -->
  <path d="M250 200 L320 210 L340 280 L300 340 L260 320 L255 280 Z" fill="#A8C4C8" opacity="0.7"/>
  <text x="300" y="260" font-family="system-ui,sans-serif" font-size="9" fill="#1C4050">Østersø</text>
  <path d="M80 200 L120 210 L125 300 L100 380 L60 360 L70 260 Z" fill="#A8C4C8" opacity="0.55"/>
  <text x="55" y="300" font-family="system-ui,sans-serif" font-size="9" fill="#1C4050">Nordsø</text>
  <!-- Slien inlet -->
  <path d="M230 300 C250 305 280 300 300 290 C290 310 270 330 245 335 C235 320 228 310 230 300 Z" fill="#6A9EAE" stroke="#1C4050" stroke-width="1"/>
  <text x="255" y="325" font-family="system-ui,sans-serif" font-size="10" fill="#0A2A35" font-weight="600">Slien</text>
  <!-- Hedeby -->
  <circle cx="248" cy="318" r="6" fill="#8B3A3A"/>
  <text x="258" y="314" font-family="system-ui,sans-serif" font-size="11" fill="#8B3A3A" font-weight="700">Hedeby</text>
  <text x="258" y="326" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">(Haithabu)</text>
  <!-- Dannevirke east-west bar -->
  <line x1="145" y1="330" x2="245" y2="320" stroke="#1C1410" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="350" font-family="system-ui,sans-serif" font-size="10" fill="#1C1410" font-weight="600">Dannevirke →</text>
  <!-- modern border dashed -->
  <line x1="140" y1="360" x2="280" y2="340" stroke="#A67C52" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="375" font-family="system-ui,sans-serif" font-size="8" fill="#A67C52">≈ nutidens DK/DE-grænse</text>
  <!-- north labels -->
  <text x="175" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#1C1410">Jylland ↑</text>
  <text x="16" y="500" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">KRØNIKE · redaktionelt skitskort · Imagine-fri (SVG)</text>
</svg>
