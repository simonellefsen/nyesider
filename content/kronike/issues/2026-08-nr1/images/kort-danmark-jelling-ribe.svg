<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="Kort: Jelling og Ribe i Danmark">
  <rect width="360" height="480" fill="#F7F1E6"/>
  <text x="14" y="26" font-family="Georgia, serif" font-size="13" fill="#1C1410" font-weight="700">Jelling &amp; Ribe</text>
  <text x="14" y="42" font-family="system-ui,sans-serif" font-size="9" fill="#5A4A3A">Hvor mission og kongemagt mødtes</text>
  <!-- Denmark outline simplified -->
  <path d="M140 40 L180 50 L200 90 L210 150 L200 220 L190 280 L175 340 L160 400 L140 440 L100 430 L90 360 L85 280 L95 200 L110 120 L125 60 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1.2"/>
  <path d="M200 220 L260 230 L280 280 L250 320 L200 300 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1"/>
  <path d="M160 400 L200 410 L220 450 L180 460 L150 440 Z" fill="#D4C4A8" stroke="#1C1410" stroke-width="1"/>
  <!-- water -->
  <ellipse cx="240" cy="200" rx="40" ry="25" fill="#A8C4C8" opacity="0.5"/>
  <text x="220" y="195" font-family="system-ui,sans-serif" font-size="8" fill="#1C4050">Kattegat</text>
  <!-- Ribe SW Jutland -->
  <circle cx="105" cy="300" r="5" fill="#8B3A3A"/>
  <text x="114" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#8B3A3A" font-weight="700">Ribe</text>
  <text x="114" y="310" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">Ansgars kirke ca. 860</text>
  <!-- Jelling inland -->
  <circle cx="155" cy="250" r="5" fill="#1C1410"/>
  <text x="164" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#1C1410" font-weight="700">Jelling</text>
  <text x="164" y="260" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">runesten · Harald</text>
  <!-- Copenhagen ref -->
  <circle cx="230" cy="270" r="3" fill="#A67C52"/>
  <text x="236" y="273" font-family="system-ui,sans-serif" font-size="8" fill="#A67C52">København (senere)</text>
  <text x="14" y="465" font-family="system-ui,sans-serif" font-size="8" fill="#5A4A3A">KRØNIKE · skitskort (SVG) · placeringer ca.</text>
</svg>
