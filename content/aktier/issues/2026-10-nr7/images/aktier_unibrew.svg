<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-rbrew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-rbrew)"/>
  
  <text x="300" y="35" fill="#0D1B2A" font-family="Georgia, serif" font-size="20" text-anchor="middle" font-weight="bold">ROYAL UNIBREW (RBREW.CO)</text>
  <text x="300" y="55" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">Nasdaq Copenhagen · CORE/YIELD</text>
  
  <!-- Price info box -->
  <rect x="50" y="75" width="200" height="120" fill="#0D1B2A" rx="5"/>
  <text x="150" y="100" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">PRIS (2. OKT)</text>
  <text x="150" y="130" fill="#ffffff" font-family="Georgia, serif" font-size="24" text-anchor="middle" font-weight="bold">DKK 405,40</text>
  <text x="150" y="155" fill="#ff6b6b" font-family="Arial" font-size="14" text-anchor="middle">−38,0 % fra top</text>
  <text x="150" y="180" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">Tester april-bund</text>
  
  <!-- Key metrics -->
  <rect x="270" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="335" y="95" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Trail P/E</text>
  <text x="335" y="118" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">12,4</text>
  
  <rect x="420" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="485" y="95" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Fwd P/E</text>
  <text x="485" y="118" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">10,7</text>
  
  <rect x="270" y="140" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="335" y="160" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Yield</text>
  <text x="335" y="183" fill="#40826D" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">4,0%</text>
  
  <rect x="420" y="140" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="485" y="160" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">P/B</text>
  <text x="485" y="183" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">3,12</text>
  
  <!-- PepsiCo box -->
  <rect x="50" y="210" width="500" height="70" fill="#C9A227" rx="5" opacity="0.2"/>
  <rect x="50" y="210" width="500" height="70" fill="none" stroke="#C9A227" stroke-width="1" rx="5"/>
  <text x="300" y="235" fill="#0D1B2A" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">PEPSICO-LICENS (21. APR 2026)</text>
  <text x="300" y="255" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">PepsiCo fornyer ikke DK/FI/Baltikum ved udløb 2028</text>
  <text x="300" y="272" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">~13% af omsætning · Carlsberg overtager fra 2029</text>
  
  <!-- Invalidation -->
  <rect x="50" y="295" width="500" height="50" fill="#ff6b6b" rx="5" opacity="0.9"/>
  <text x="300" y="318" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">INVALIDATION: Lukkekurs under DKK 394,60</text>
  <text x="300" y="335" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(april 52-ugers bund) eller FY26-guide cut (11. nov)</text>
  
  <!-- Bottom line -->
  <text x="300" y="375" fill="#0D1B2A" font-family="Georgia, serif" font-size="11" text-anchor="middle" font-style="italic">"Første nye københavnskandidat siden Rockwool"</text>
</svg>
