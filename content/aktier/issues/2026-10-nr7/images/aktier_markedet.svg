<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-markedet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-markedet)"/>
  
  <text x="300" y="30" fill="#0D1B2A" font-family="Georgia, serif" font-size="16" text-anchor="middle" font-weight="bold">Indeks vs. vores kandidater</text>
  <text x="300" y="50" fill="#888888" font-family="Arial" font-size="11" text-anchor="middle">Performance siden nr. 1</text>
  
  <!-- Bar chart -->
  <g transform="translate(100, 80)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="220" stroke="#333" stroke-width="1"/>
    <text x="-10" y="10" fill="#888888" font-family="Arial" font-size="9" text-anchor="end">+5%</text>
    <text x="-10" y="115" fill="#888888" font-family="Arial" font-size="9" text-anchor="end">0%</text>
    <text x="-10" y="220" fill="#888888" font-family="Arial" font-size="9" text-anchor="end">−15%</text>
    <line x1="0" y1="105" x2="400" y2="105" stroke="#333" stroke-width="0.5" stroke-dasharray="2,2"/>
    
    <!-- SPY bar -->
    <rect x="30" y="103" width="50" height="4" fill="#40826D"/>
    <text x="55" y="130" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">SPY</text>
    <text x="55" y="145" fill="#40826D" font-family="Arial" font-size="9" text-anchor="middle">~0%</text>
    
    <!-- EUNL bar -->
    <rect x="110" y="90" width="50" height="15" fill="#40826D"/>
    <text x="135" y="130" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">EUNL</text>
    <text x="135" y="145" fill="#40826D" font-family="Arial" font-size="9" text-anchor="middle">+1,8%</text>
    
    <!-- Our portfolio bar -->
    <rect x="190" y="105" width="50" height="63" fill="#ff6b6b"/>
    <text x="215" y="185" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">Vores</text>
    <text x="215" y="200" fill="#ff6b6b" font-family="Arial" font-size="9" text-anchor="middle">−6,3%</text>
    
    <!-- Legend -->
    <rect x="280" y="20" width="12" height="12" fill="#40826D"/>
    <text x="298" y="30" fill="#0D1B2A" font-family="Arial" font-size="10">Indeks (gevinst)</text>
    <rect x="280" y="40" width="12" height="12" fill="#ff6b6b"/>
    <text x="298" y="50" fill="#0D1B2A" font-family="Arial" font-size="10">Vores kandidater (tab)</text>
  </g>
  
  <!-- Stats boxes -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="150" height="50" fill="#0D1B2A" rx="5"/>
    <text x="75" y="22" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">4 af 28 op</text>
    <text x="75" y="38" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">AD.AS, CAP, WKL, INTU</text>
    
    <rect x="170" y="0" width="150" height="50" fill="#0D1B2A" rx="5"/>
    <text x="245" y="22" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">9 invalideret</text>
    <text x="245" y="38" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">ZTS, BMW, HUSQ, NKE...</text>
    
    <rect x="340" y="0" width="150" height="50" fill="#0D1B2A" rx="5"/>
    <text x="415" y="22" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SPY: P/E 24,9</text>
    <text x="415" y="38" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">QQQ: P/E 30,6</text>
  </g>
</svg>
