  <text x="300" y="318" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">INVALIDATION: Lukkekurs under $174,47</text>
  <text x="300" y="335" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(fuldt gap-fill af Q4-bounce) eller FY27-guide cut</text>
  
