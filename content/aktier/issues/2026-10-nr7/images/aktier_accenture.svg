  <text x="150" y="130" fill="#ffffff" font-family="Georgia, serif" font-size="28" text-anchor="middle" font-weight="bold">$198,90</text>
  <text x="150" y="155" fill="#ff6b6b" font-family="Arial" font-size="14" text-anchor="middle">−31,7 % fra top</text>
  <text x="150" y="180" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">+60 % over bund</text>
  
  <!-- Key metrics -->
  <rect x="270" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="335" y="95" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Trail P/E</text>
  <text x="335" y="118" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">15,9</text>
  
  <rect x="420" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
