      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-acn)"/>
  
  <text x="300" y="35" fill="#0D1B2A" font-family="Georgia, serif" font-size="20" text-anchor="middle" font-weight="bold">ACCENTURE (ACN)</text>
