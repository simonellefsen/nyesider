<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-bkng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-bkng)"/>
  
  <text x="300" y="35" fill="#0D1B2A" font-family="Georgia, serif" font-size="20" text-anchor="middle" font-weight="bold">BOOKING HOLDINGS (BKNG)</text>
  <text x="300" y="55" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">NasdaqGS · SATELLITE</text>
  
  <!-- Price info box -->
  <rect x="50" y="75" width="200" height="120" fill="#0D1B2A" rx="5"/>
  <text x="150" y="100" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">PRIS (2. OKT)</text>
  <text x="150" y="130" fill="#ffffff" font-family="Georgia, serif" font-size="28" text-anchor="middle" font-weight="bold">$159,02</text>
  <text x="150" y="155" fill="#ff6b6b" font-family="Arial" font-size="14" text-anchor="middle">−29,3 % fra top</text>
  <text x="150" y="180" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">Kun 3% over støtte</text>
  
  <!-- Key metrics -->
  <rect x="270" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="335" y="95" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Trail P/E</text>
  <text x="335" y="118" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">17,6</text>
  
  <rect x="420" y="75" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="485" y="95" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Fwd P/E</text>
  <text x="485" y="118" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">12,9</text>
  
  <rect x="270" y="140" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="335" y="160" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">Yield</text>
  <text x="335" y="183" fill="#40826D" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">1,1%</text>
  
  <rect x="420" y="140" width="130" height="55" fill="#0D1B2A" rx="5"/>
  <text x="485" y="160" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">1-mdr chg</text>
  <text x="485" y="183" fill="#ff6b6b" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">−20%</text>
  
  <!-- Why fell box -->
  <rect x="50" y="210" width="500" height="70" fill="#ff6b6b" rx="5" opacity="0.15"/>
  <rect x="50" y="210" width="500" height="70" fill="none" stroke="#ff6b6b" stroke-width="1" rx="5"/>
  <text x="300" y="235" fill="#ff6b6b" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">HVORFOR DEN FALDT (SEP 2026)</text>
  <text x="300" y="255" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">1) eTraveli-deal blokeret (EU) | 2) Meta Muse AI-agent frygt</text>
  <text x="300" y="272" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">3) Brent > $100 | 4) Fed rentehævning</text>
  
  <!-- Invalidation -->
  <rect x="50" y="295" width="500" height="50" fill="#ff6b6b" rx="5" opacity="0.9"/>
  <text x="300" y="318" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">INVALIDATION: Lukkekurs under $154,13</text>
  <text x="300" y="335" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">(maj-bund) eller Q3 room-night vækst &lt;3%</text>
  
  <!-- Bottom line -->
  <text x="300" y="375" fill="#0D1B2A" font-family="Georgia, serif" font-size="11" text-anchor="middle" font-style="italic">"AI-agent-frygt uden tal bag sig – Q3 er testen"</text>
