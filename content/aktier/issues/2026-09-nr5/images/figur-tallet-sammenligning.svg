<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <text x="300" y="25" fill="#0D1B2A" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Fem kandidater  P/E vs. Drawdown scatter</text>
  
  <!-- Axes -->
  <line x1="80" y1="250" x2="550" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="50" x2="80" y2="250" stroke="#333" stroke-width="1"/>
  
  <!-- Y-axis (Drawdown) -->
  <text x="30" y="55" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">35%</text>
  <text x="30" y="150" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">25%</text>
  <text x="30" y="245" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">15%</text>
  <text x="30" y="150" fill="#666" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(-90, 30, 150)">Drawdown</text>
  
  <!-- X-axis (P/E) -->
  <text x="120" y="270" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">8</text>
  <text x="220" y="270" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">12</text>
  <text x="320" y="270" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">15</text>
  <text x="420" y="270" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">18</text>
  <text x="520" y="270" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">20</text>
  <text x="315" y="290" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">Trailing P/E</text>
  
  <!-- Scatter points -->
  <!-- ADBE: P/E 15, -33% -->
  <circle cx="320" cy="75" r="15" fill="#FF0000" opacity="0.8"/>
  <text x="320" y="80" fill="#FFF" font-family="Arial" font-size="8" text-anchor="middle">ADBE</text>
  
  <!-- UPS: P/E 15.1, -19% -->
  <circle cx="325" cy="200" r="15" fill="#5C4033" opacity="0.8"/>
  <text x="325" y="205" fill="#FFF" font-family="Arial" font-size="8" text-anchor="middle">UPS</text>
  
  <!-- SAN: P/E 19.3, -19% -->
  <circle cx="480" cy="200" r="15" fill="#4B0082" opacity="0.8"/>
  <text x="480" y="205" fill="#FFF" font-family="Arial" font-size="8" text-anchor="middle">SAN</text>
  
  <!-- TEL: P/E 11.3, -26% -->
  <circle cx="180" cy="130" r="15" fill="#00509E" opacity="0.8"/>
  <text x="180" y="135" fill="#FFF" font-family="Arial" font-size="8" text-anchor="middle">TEL</text>
  
  <!-- DTE: P/E 15.8, -21% -->
  <circle cx="360" cy="175" r="15" fill="#E20074" opacity="0.8"/>
  <text x="360" y="180" fill="#FFF" font-family="Arial" font-size="8" text-anchor="middle">DTE</text>
  
  <!-- Quadrant labels -->
  <text x="150" y="70" fill="#40826D" font-family="Arial" font-size="9">Billig + stor rabat</text>
  <text x="450" y="230" fill="#778DA9" font-family="Arial" font-size="9">Dyrere + mindre rabat</text>
</svg>
