<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <text x="300" y="35" fill="#0D1B2A" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Markedet · uge 38 · 2026</text>
  <text x="300" y="55" fill="#415A77" font-family="Arial" font-size="11" text-anchor="middle">Indekser tæt på toppen  enkeltnavn solgt ned</text>
  
  <!-- Bar chart showing indices near top -->
  <g transform="translate(50, 90)">
    <!-- SPY bar -->
    <rect x="20" y="20" width="70" height="180" fill="#40826D" rx="4"/>
    <text x="55" y="220" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">SPY</text>
    <text x="55" y="235" fill="#415A77" font-family="Arial" font-size="9" text-anchor="middle">2,3%</text>
    
    <!-- QQQ bar -->
    <rect x="120" y="30" width="70" height="170" fill="#40826D" rx="4"/>
    <text x="155" y="220" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">QQQ</text>
    <text x="155" y="235" fill="#415A77" font-family="Arial" font-size="9" text-anchor="middle">3,6%</text>
    
    <!-- EUNL bar -->
    <rect x="220" y="22" width="70" height="178" fill="#40826D" rx="4"/>
    <text x="255" y="220" fill="#0D1B2A" font-family="Arial" font-size="10" text-anchor="middle">EUNL</text>
    <text x="255" y="235" fill="#415A77" font-family="Arial" font-size="9" text-anchor="middle">2,2%</text>
    
    <!-- Divider -->
    <line x1="310" y1="10" x2="310" y2="200" stroke="#778DA9" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- ADBE bar (shorter - more down) -->
    <rect x="340" y="80" width="50" height="120" fill="#C9A227" rx="4"/>
    <text x="365" y="220" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">ADBE</text>
    <text x="365" y="235" fill="#C9A227" font-family="Arial" font-size="8" text-anchor="middle">33%</text>
    
    <!-- TEL bar -->
    <rect x="400" y="70" width="50" height="130" fill="#C9A227" rx="4"/>
    <text x="425" y="220" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">TEL</text>
    <text x="425" y="235" fill="#C9A227" font-family="Arial" font-size="8" text-anchor="middle">26%</text>
    
    <!-- DTE bar -->
    <rect x="460" y="60" width="50" height="140" fill="#C9A227" rx="4"/>
    <text x="485" y="220" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">DTE</text>
    <text x="485" y="235" fill="#C9A227" font-family="Arial" font-size="8" text-anchor="middle">21%</text>
  </g>
  
  <text x="145" y="360" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">Indekser ved toppen</text>
  <text x="430" y="360" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">Enkeltnavn i rabat</text>
  <text x="300" y="390" fill="#778DA9" font-family="Arial" font-size="9" text-anchor="middle">Kilde: Yahoo Finance · 18. sep 2026</text>
</svg>
