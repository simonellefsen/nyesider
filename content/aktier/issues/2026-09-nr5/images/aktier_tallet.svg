<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <text x="300" y="35" fill="#0D1B2A" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">TALLET</text>
  <text x="300" y="55" fill="#415A77" font-family="Arial" font-size="11" text-anchor="middle">Fem kandidater  % fra 52-ugers top</text>
  
  <!-- Horizontal bar chart -->
  <g transform="translate(50, 80)">
    <!-- ADBE -->
    <text x="0" y="20" fill="#0D1B2A" font-family="Arial" font-size="11">ADBE</text>
    <rect x="70" y="8" width="328" height="20" fill="#C9A227" rx="3"/>
    <text x="410" y="22" fill="#0D1B2A" font-family="Arial" font-size="10">32,8%</text>
    
    <!-- TEL.OL -->
    <text x="0" y="60" fill="#0D1B2A" font-family="Arial" font-size="11">TEL.OL</text>
    <rect x="70" y="48" width="261" height="20" fill="#C9A227" rx="3"/>
    <text x="345" y="62" fill="#0D1B2A" font-family="Arial" font-size="10">26,1%</text>
    
    <!-- DTE.DE -->
    <text x="0" y="100" fill="#0D1B2A" font-family="Arial" font-size="11">DTE.DE</text>
    <rect x="70" y="88" width="211" height="20" fill="#40826D" rx="3"/>
    <text x="295" y="102" fill="#0D1B2A" font-family="Arial" font-size="10">21,1%</text>
    
    <!-- UPS -->
    <text x="0" y="140" fill="#0D1B2A" font-family="Arial" font-size="11">UPS</text>
    <rect x="70" y="128" width="191" height="20" fill="#40826D" rx="3"/>
    <text x="275" y="142" fill="#0D1B2A" font-family="Arial" font-size="10">19,1%</text>
    
    <!-- SAN.PA -->
    <text x="0" y="180" fill="#0D1B2A" font-family="Arial" font-size="11">SAN.PA</text>
    <rect x="70" y="168" width="188" height="20" fill="#40826D" rx="3"/>
    <text x="272" y="182" fill="#0D1B2A" font-family="Arial" font-size="10">18,8%</text>
  </g>
  
  <!-- Legend -->
  <rect x="150" y="310" width="15" height="15" fill="#C9A227"/>
  <text x="175" y="322" fill="#0D1B2A" font-family="Arial" font-size="10">&gt;25% fra top</text>
  <rect x="300" y="310" width="15" height="15" fill="#40826D"/>
  <text x="325" y="322" fill="#0D1B2A" font-family="Arial" font-size="10">&lt;25% fra top</text>
  
  <text x="300" y="360" fill="#778DA9" font-family="Arial" font-size="11" text-anchor="middle">Alle: intakt forretning · klar invalidation</text>
  <text x="300" y="385" fill="#415A77" font-family="Arial" font-size="9" text-anchor="middle">Kilde: Yahoo Finance · 18. sep 2026</text>
</svg>
