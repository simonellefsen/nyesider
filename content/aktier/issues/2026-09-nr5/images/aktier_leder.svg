  <text x="300" y="320" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle">CORE · YIELD · CORE/YIELD</text>
  <text x="300" y="345" fill="#778DA9" font-family="Arial" font-size="10" text-anchor="middle">Adobe · UPS · Sanofi · Telenor · Deutsche Telekom</text>
