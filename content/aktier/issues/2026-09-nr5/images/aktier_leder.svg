<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B263B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <text x="300" y="50" fill="#C9A227" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">AKTIER MED GROK · NR. 5</text>
  <text x="300" y="80" fill="#E0E1DD" font-family="Arial" font-size="12" text-anchor="middle">Fem nye kandidater</text>
  
  <!-- Five downward arrows representing the five candidates -->
  <g transform="translate(80,120)">
    <polygon points="40,0 80,60 60,60 60,120 20,120 20,60 0,60" fill="#C9A227"/>
    <text x="40" y="150" fill="#E0E1DD" font-family="Arial" font-size="11" text-anchor="middle">ADBE</text>
    <text x="40" y="165" fill="#778DA9" font-family="Arial" font-size="9" text-anchor="middle">33%</text>
  </g>
  <g transform="translate(180,120)">
    <polygon points="40,0 80,60 60,60 60,100 20,100 20,60 0,60" fill="#40826D"/>
    <text x="40" y="130" fill="#E0E1DD" font-family="Arial" font-size="11" text-anchor="middle">UPS</text>
    <text x="40" y="145" fill="#778DA9" font-family="Arial" font-size="9" text-anchor="middle">19%</text>
  </g>
  <g transform="translate(280,120)">
    <polygon points="40,0 80,60 60,60 60,100 20,100 20,60 0,60" fill="#40826D"/>
    <text x="40" y="130" fill="#E0E1DD" font-family="Arial" font-size="11" text-anchor="middle">SAN.PA</text>
