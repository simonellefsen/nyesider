  <text x="200" y="208" fill="#40826D" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+20,9 %</text>
  
  <text x="400" y="190" fill="#888888" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">INVALIDATION</text>
  <text x="400" y="208" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Lukke &lt;$22,14</text>
  
  <!-- Bottom text -->
  <text x="300" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Q3 beat-and-raise - bekraeftet hoejere bund</text>
  <text x="300" y="285" fill="#888888" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Kilde: Yahoo Finance - lukkekurs 9. okt 2026</text>
