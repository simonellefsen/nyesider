<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-tallet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg-tallet)"/>
  <text x="300" y="25" fill="#0D1B2A" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="bold">Tallet: En kandidat</text>
  <text x="300" y="42" fill="#888888" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Faerre, strammere kriterier</text>
  
  <!-- Single candidate card -->
  <rect x="100" y="60" width="400" height="180" fill="#ffffff" stroke="#C9A227" stroke-width="3" rx="10"/>
  
  <text x="300" y="90" fill="#0D1B2A" font-family="Georgia, serif" font-size="18" text-anchor="middle" font-weight="bold">CCL - Carnival Corporation</text>
  <text x="300" y="110" fill="#888888" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">NYSE - SATELLITE</text>
  
  <!-- Metrics row 1 -->
  <text x="150" y="140" fill="#888888" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">PRIS</text>
  <text x="150" y="158" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">$26,35</text>
  
  <text x="250" y="140" fill="#888888" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">FRA TOP</text>
  <text x="250" y="158" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">-22,6 %</text>
  
  <text x="350" y="140" fill="#888888" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">FWD P/E</text>
  <text x="350" y="158" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">10,3</text>
  
  <text x="450" y="140" fill="#888888" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">YIELD</text>
  <text x="450" y="158" fill="#40826D" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">1,7 %</text>
  
