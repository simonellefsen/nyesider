<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-telecom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg-telecom)"/>
  <text x="300" y="25" fill="#0D1B2A" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="bold">Telekomchokket: 9. oktober 2026</text>
  <text x="300" y="42" fill="#888888" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Vaerste dag i 20+ aar for US-telekom</text>
  
  <!-- SpaceX spektrum icon -->
  <rect x="40" y="70" width="520" height="50" fill="#0D1B2A" rx="5"/>
  <text x="300" y="95" fill="#C9A227" font-family="Georgia, serif" font-size="12" text-anchor="middle">SpaceX aftaler kob af 800 MHz spektrum fra Grain (~$8 mia.)</text>
  <text x="300" y="112" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">FCC-godkendelse afventes - direkte konkurrence til TMUS/VZ/T</text>
  
  <!-- Comparison bars -->
  <line x1="80" y1="220" x2="520" y2="220" stroke="#333333" stroke-width="1"/>
  
  <!-- TMUS -->
  <rect x="100" y="145" width="80" height="75" fill="#ff6b6b"/>
  <text x="140" y="235" fill="#333333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">TMUS</text>
  <text x="140" y="165" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">-13,3 %</text>
  <text x="140" y="180" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">$148,58</text>
  
  <!-- VZ -->
  <rect x="200" y="165" width="80" height="55" fill="#ff6b6b"/>
  <text x="240" y="235" fill="#333333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">VZ</text>
  <text x="240" y="185" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">-8,8 %</text>
  <text x="240" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">$41,65</text>
  
  <!-- T -->
  <rect x="300" y="160" width="80" height="60" fill="#ff6b6b"/>
  <text x="340" y="235" fill="#333333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">T</text>
  <text x="340" y="180" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">-9,8 %</text>
  <text x="340" y="195" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">$22,18</text>
  
  <!-- Tower stocks (positive) -->
  <rect x="400" y="180" width="50" height="40" fill="#40826D"/>
  <text x="425" y="235" fill="#333333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">CCI</text>
  <text x="425" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">+16 %</text>
  
  <rect x="460" y="190" width="50" height="30" fill="#40826D"/>
  <text x="485" y="235" fill="#333333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">AMT</text>
  <text x="485" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">+9 %</text>
  
  <!-- Note -->
  <text x="300" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Samlet tab: ~$58 mia. markedsvaerdi</text>
  <text x="300" y="285" fill="#888888" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Kilde: Yahoo Finance, CNBC, etf.net</text>
</svg>
