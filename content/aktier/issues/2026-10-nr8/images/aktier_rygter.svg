  <rect x="460" y="185" width="100" height="55" fill="#888888" rx="5"/>
  <text x="510" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Nordic</text>
