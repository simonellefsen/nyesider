  <text x="510" y="235" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">denne uge</text>
  
  <!-- Source -->
  <text x="300" y="285" fill="#888888" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Bekraeftet bund kraeves - vi kober ikke shock-day lav</text>
