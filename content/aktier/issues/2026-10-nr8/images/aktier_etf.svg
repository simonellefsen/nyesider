<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-etf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg-etf)"/>
  <text x="300" y="25" fill="#0D1B2A" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="bold">ETF'erne: US ved toppen</text>
  <text x="300" y="42" fill="#888888" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Ingen ETF anbefales - rabat kun i enkeltnavn</text>
  
  <!-- US row -->
  <text x="80" y="70" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="11" font-weight="bold">US / Verden</text>
  
  <rect x="80" y="80" width="100" height="55" fill="#40826D" rx="5"/>
  <text x="130" y="100" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">SPY</text>
  <text x="130" y="118" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">-0,4 %</text>
  <text x="130" y="130" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">P/E ~25</text>
  
  <rect x="190" y="80" width="100" height="55" fill="#40826D" rx="5"/>
  <text x="240" y="100" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">QQQ</text>
