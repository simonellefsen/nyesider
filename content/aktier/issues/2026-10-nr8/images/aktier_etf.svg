  <rect x="80" y="170" width="100" height="55" fill="#C9A227" rx="5"/>
  <text x="130" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">EXSA</text>
  <text x="130" y="208" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">-5,5 %</text>
  <text x="130" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">P/E ~17</text>
  
  <rect x="190" y="170" width="100" height="55" fill="#C9A227" rx="5"/>
  <text x="240" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">DAX</text>
  <text x="240" y="208" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">-5,8 %</text>
  <text x="240" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Tyskland</text>
  
  <rect x="300" y="170" width="100" height="55" fill="#ff6b6b" rx="5"/>
  <text x="350" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">CAC 40</text>
  <text x="350" y="208" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">-10,9 %</text>
  <text x="350" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Dybest</text>
  
  <!-- Verdict box -->
  <rect x="420" y="100" width="160" height="100" fill="#0D1B2A" rx="5"/>
  <text x="500" y="130" fill="#C9A227" font-family="Georgia, serif" font-size="11" text-anchor="middle">VERDICT</text>
  <text x="500" y="155" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Ingen ETF</text>
  <text x="500" y="175" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">US ved top P/E 25-29</text>
  <text x="500" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Europa mildt dip</text>
  
  <!-- Source -->
  <text x="300" y="285" fill="#888888" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Kilde: Yahoo Finance - fra 52w top - lukkekurs 9. okt 2026</text>
</svg>
