  <text x="240" y="130" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">P/E ~29</text>
  
  <rect x="300" y="80" width="100" height="55" fill="#40826D" rx="5"/>
  <text x="350" y="100" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">EUNL</text>
  <text x="350" y="118" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">-0,5 %</text>
  <text x="350" y="130" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Verden</text>
  
  <!-- Europe row -->
