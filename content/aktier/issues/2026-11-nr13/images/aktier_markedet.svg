  <text x="490.0" y="190.0" text-anchor="middle" class="box-sub">21 af 24 i plus</text>
  <rect x="20.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="110.0" y="240.0" text-anchor="middle" class="box-title">SPY</text>
  <text x="110.0" y="302.5" text-anchor="middle" class="box-value">+2,6 %</text>
  <text x="110.0" y="355.0" text-anchor="middle" class="box-sub">Indekset slog os</text>
  <rect x="210.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="300.0" y="240.0" text-anchor="middle" class="box-title">OMXC25</text>
  <text x="300.0" y="302.5" text-anchor="middle" class="box-value">+0,4 %</text>
  <text x="300.0" y="355.0" text-anchor="middle" class="box-sub">København halter</text>
  <rect x="400.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="490.0" y="240.0" text-anchor="middle" class="box-title">Energi + Chips</text>
  <text x="490.0" y="302.5" text-anchor="middle" class="box-value">LEDTE</text>
  <text x="490.0" y="355.0" text-anchor="middle" class="box-sub">Sektorer vi ikke ejer</text>
