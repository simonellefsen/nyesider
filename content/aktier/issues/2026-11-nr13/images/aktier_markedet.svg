<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    .title { font: bold 16px sans-serif; fill: #0D1B2A; }
    .box-title { font: bold 11px sans-serif; fill: #0D1B2A; }
    .box-value { font: bold 24px sans-serif; fill: #C9A227; }
    .box-sub { font: 10px sans-serif; fill: #666; }
    .box-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
    .positive { fill: #40826D; }
    .negative { fill: #E53935; }
  </style>
  <rect width="600" height="400" fill="#FAFAFA"/>
  <text x="300.0" y="30" text-anchor="middle" class="title">Markedet 9.−13. november 2026</text>
  <rect x="20.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="110.0" y="75.0" text-anchor="middle" class="box-title">S&amp;P 500</text>
  <text x="110.0" y="137.5" text-anchor="middle" class="positive">+2,5 %</text>
  <text x="110.0" y="190.0" text-anchor="middle" class="box-sub">Bedste uge siden august</text>
  <rect x="210.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="300.0" y="75.0" text-anchor="middle" class="box-title">STOXX 600</text>
  <text x="300.0" y="137.5" text-anchor="middle" class="positive">REKORD</text>
  <text x="300.0" y="190.0" text-anchor="middle" class="box-sub">+2,4 % til 664,14</text>
  <rect x="400.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="490.0" y="75.0" text-anchor="middle" class="box-title">Vores 24 aktive</text>
