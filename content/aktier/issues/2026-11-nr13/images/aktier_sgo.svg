    .box-value { font: bold 24px sans-serif; fill: #C9A227; }
    .box-sub { font: 10px sans-serif; fill: #666; }
    .box-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
    .positive { fill: #40826D; }
    .negative { fill: #E53935; }
  </style>
  <rect width="600" height="400" fill="#FAFAFA"/>
  <text x="300.0" y="30" text-anchor="middle" class="title">Saint-Gobain − Nøgletal</text>
  <rect x="20.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="110.0" y="75.0" text-anchor="middle" class="box-title">Ticker</text>
  <text x="110.0" y="137.5" text-anchor="middle" class="box-value">SGO.PA</text>
  <text x="110.0" y="190.0" text-anchor="middle" class="box-sub">Euronext Paris</text>
  <rect x="210.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="300.0" y="75.0" text-anchor="middle" class="box-title">Forward P/E</text>
  <text x="300.0" y="137.5" text-anchor="middle" class="box-value">11,5</text>
  <text x="300.0" y="190.0" text-anchor="middle" class="box-sub">EPS €6,57</text>
  <rect x="400.0" y="50.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="490.0" y="75.0" text-anchor="middle" class="box-title">P/B</text>
