  <rect x="20.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="110.0" y="240.0" text-anchor="middle" class="box-title">Fra 52w top</text>
  <text x="110.0" y="302.5" text-anchor="middle" class="negative">−17,5 %</text>
  <text x="110.0" y="355.0" text-anchor="middle" class="box-sub">€91,30 → €75,30</text>
  <rect x="210.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="300.0" y="240.0" text-anchor="middle" class="box-title">Invalidation</text>
  <text x="300.0" y="302.5" text-anchor="middle" class="negative">€70,00</text>
  <text x="300.0" y="355.0" text-anchor="middle" class="box-sub">Single close</text>
  <rect x="400.0" y="215.0" width="180.0" height="155.0" rx="5" class="box-bg"/>
  <text x="490.0" y="240.0" text-anchor="middle" class="box-title">Sleeve</text>
  <text x="490.0" y="302.5" text-anchor="middle" class="box-value">SATELLITE</text>
  <text x="490.0" y="355.0" text-anchor="middle" class="box-sub">ROCK-B overlap</text>
