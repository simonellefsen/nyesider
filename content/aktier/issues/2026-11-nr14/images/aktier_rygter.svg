<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    .title { font: bold 16px sans-serif; fill: #0D1B2A; }
    .box-title { font: bold 11px sans-serif; fill: #0D1B2A; }
    .box-value { font: bold 20px sans-serif; fill: #C9A227; }
    .box-sub { font: 10px sans-serif; fill: #666; }
    .box-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
    .positive { fill: #40826D; }
    .negative { fill: #E53935; }
  </style>
  <rect width="600" height="400" fill="#FAFAFA"/>
  <text x="300" y="30" text-anchor="middle" class="title">Følgelisten og Rygtebørsen</text>
  <rect x="20" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="110" y="75" text-anchor="middle" class="box-title">NVDA</text>
  <text x="110" y="130" text-anchor="middle" class="box-value">Følger</text>
  <text x="110" y="175" text-anchor="middle" class="box-sub">Højere lav + CEO</text>
  <text x="110" y="190" text-anchor="middle" class="box-sub">+ SEC-klarhed</text>
  <rect x="210" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="300" y="75" text-anchor="middle" class="box-title">DG.PA (Vinci)</text>
  <text x="300" y="130" text-anchor="middle" class="box-value">Watch</text>
  <text x="300" y="175" text-anchor="middle" class="box-sub">Basen holdt</text>
  <text x="300" y="190" text-anchor="middle" class="box-sub">SGO først</text>
  <rect x="400" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="490" y="75" text-anchor="middle" class="box-title">GIS (Gen. Mills)</text>
  <text x="490" y="130" text-anchor="middle" class="positive">+4,1 %</text>
  <text x="490" y="175" text-anchor="middle" class="box-sub">I crash-ugen</text>
  <text x="490" y="190" text-anchor="middle" class="box-sub">Rapport 17. dec</text>
  <rect x="20" y="215" width="180" height="155" rx="5" class="box-bg"/>
  <text x="110" y="240" text-anchor="middle" class="box-title">GOOGL</text>
  <text x="110" y="302.5" text-anchor="middle" class="negative">Fjernet</text>
  <text x="110" y="355" text-anchor="middle" class="box-sub">Brød $273,50</text>
  <rect x="210" y="215" width="180" height="155" rx="5" class="box-bg"/>
  <text x="300" y="240" text-anchor="middle" class="box-title">COF</text>
  <text x="300" y="302.5" text-anchor="middle" class="negative">Fjernet</text>
  <text x="300" y="355" text-anchor="middle" class="box-sub">Brød $193-basen</text>
  <rect x="400" y="215" width="180" height="155" rx="5" class="box-bg"/>
  <text x="490" y="240" text-anchor="middle" class="box-title">København</text>
  <text x="490" y="302.5" text-anchor="middle" class="negative">Ingen</text>
  <text x="490" y="355" text-anchor="middle" class="box-sub">Intet opfyldte kravet</text>
</svg>