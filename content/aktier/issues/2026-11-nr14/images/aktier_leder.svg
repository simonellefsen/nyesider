<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    .title { font: bold 16px sans-serif; fill: #0D1B2A; }
    .box-title { font: bold 11px sans-serif; fill: #0D1B2A; }
    .box-value { font: bold 24px sans-serif; fill: #C9A227; }
    .box-sub { font: 10px sans-serif; fill: #666; }
    .box-bg { fill: #F5F5F5; stroke: #E0E0E0; stroke-width: 1; }
    .positive { fill: #40826D; }
    .negative { fill: #E53935; }
  </style>
  <rect width="600" height="400" fill="#FAFAFA"/>
  <text x="300" y="30" text-anchor="middle" class="title">Nr. 14 − Overblik</text>
  <rect x="20" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="110" y="75" text-anchor="middle" class="box-title">S&amp;P 500 uge</text>
  <text x="110" y="137.5" text-anchor="middle" class="negative">−8,6 %</text>
  <text x="110" y="190" text-anchor="middle" class="box-sub">Værste siden april 2025</text>
  <rect x="210" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="300" y="75" text-anchor="middle" class="box-title">Nvidia uge</text>
  <text x="300" y="137.5" text-anchor="middle" class="negative">−22,9 %</text>
  <text x="300" y="190" text-anchor="middle" class="box-sub">Trods rekordkvartal</text>
  <rect x="400" y="50" width="180" height="155" rx="5" class="box-bg"/>
  <text x="490" y="75" text-anchor="middle" class="box-title">Nye kandidater</text>
  <text x="490" y="137.5" text-anchor="middle" class="box-value">0</text>
  <text x="490" y="190" text-anchor="middle" class="box-sub">Som nr. 9: vi køber intet</text>
  <rect x="20" y="215" width="180" height="155" rx="5" class="box-bg"/>
