  <text x="110" y="302.5" text-anchor="middle" class="negative">1,7 % fra exit</text>
  <text x="110" y="355" text-anchor="middle" class="box-sub">€71,22 vs €70,00</text>
  <rect x="210" y="215" width="180" height="155" rx="5" class="box-bg"/>
  <text x="300" y="240" text-anchor="middle" class="box-title">INTU uge</text>
  <text x="300" y="302.5" text-anchor="middle" class="negative">−20,9 %</text>
