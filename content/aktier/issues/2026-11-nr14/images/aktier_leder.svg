  <rect x="400" y="215" width="180" height="155" rx="5" class="box-bg"/>
  <text x="490" y="240" text-anchor="middle" class="box-title">Aktive efter nr. 14</text>
  <text x="490" y="302.5" text-anchor="middle" class="box-value">25</text>
  <text x="490" y="355" text-anchor="middle" class="box-sub">Ingen ændring</text>
