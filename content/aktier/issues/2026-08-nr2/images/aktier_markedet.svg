<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Bar chart representing index levels near top -->
  <g transform="translate(100, 100)">
    <!-- Bars at nearly full height (indexes near top) -->
    <rect x="50" y="20" width="80" height="280" fill="#C9A227" opacity="0.8"/>
    <rect x="170" y="30" width="80" height="270" fill="#C9A227" opacity="0.7"/>
    <rect x="290" y="25" width="80" height="275" fill="#C9A227" opacity="0.6"/>
    <rect x="410" y="15" width="80" height="285" fill="#C9A227" opacity="0.5"/>
    
    <!-- Top line (52w high) -->
    <line x1="30" y1="10" x2="510" y2="10" stroke="#40826D" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Labels -->
    <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">S&amp;P</text>
    <text x="210" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">DAX</text>
    <text x="330" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">OMXC</text>
    <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">OMXS</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff">Indekserne holder toppen</text>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Redaktionelt diagram · Nye Sider</text>
</svg>
