<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Abstract compass/direction motif -->
  <circle cx="400" cy="250" r="150" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="250" r="100" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.2"/>
  <circle cx="400" cy="250" r="50" fill="none" stroke="#40826D" stroke-width="2"/>
  
  <!-- Direction arrow (pointing down for dips) -->
  <path d="M400 150 L400 350" stroke="#C9A227" stroke-width="3"/>
  <path d="M380 330 L400 350 L420 330" stroke="#C9A227" stroke-width="3" fill="none"/>
  
  <!-- Four dots representing four candidates -->
  <circle cx="320" cy="200" r="12" fill="#40826D" opacity="0.8"/>
  <circle cx="480" cy="200" r="12" fill="#40826D" opacity="0.8"/>
  <circle cx="320" cy="300" r="12" fill="#40826D" opacity="0.8"/>
  <circle cx="480" cy="300" r="12" fill="#40826D" opacity="0.8"/>
  
  <!-- Text -->
  <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#fff">Fire dips</text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#888">Redaktionelt diagram · Nye Sider</text>
</svg>
