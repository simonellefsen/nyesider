<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Horizontal bar chart of % from 52w top -->
  <g transform="translate(200, 80)">
    <!-- Labels and bars -->
    <text x="-10" y="45" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#C9A227">PYPL</text>
    <rect x="0" y="30" width="194" height="25" fill="#C9A227" opacity="0.8"/>
    <text x="200" y="48" font-family="Arial, sans-serif" font-size="12" fill="#888">32,3 %</text>
    
    <text x="-10" y="95" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#40826D">YAR</text>
    <rect x="0" y="80" width="153" height="25" fill="#40826D" opacity="0.8"/>
    <text x="160" y="98" font-family="Arial, sans-serif" font-size="12" fill="#888">25,5 %</text>
    
    <text x="-10" y="145" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#C9A227">HUSQ</text>
    <rect x="0" y="130" width="178" height="25" fill="#C9A227" opacity="0.7"/>
    <text x="185" y="148" font-family="Arial, sans-serif" font-size="12" fill="#888">29,7 %</text>
    
    <text x="-10" y="195" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#40826D">AD</text>
    <rect x="0" y="180" width="169" height="25" fill="#40826D" opacity="0.7"/>
    <text x="175" y="198" font-family="Arial, sans-serif" font-size="12" fill="#888">28,1 %</text>
    
    <!-- Scale markers -->
    <line x1="0" y1="220" x2="0" y2="230" stroke="#888" stroke-width="1"/>
    <text x="0" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">0 %</text>
    
    <line x1="300" y1="220" x2="300" y2="230" stroke="#888" stroke-width="1"/>
    <text x="300" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">50 %</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff">Fire kandidater: afstand fra top</text>
  <text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Redaktionelt diagram · Nye Sider</text>
</svg>
