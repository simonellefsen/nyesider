<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Three X marks for rejected stocks -->
  <g transform="translate(200, 150)">
    <!-- X 1 -->
    <line x1="0" y1="0" x2="60" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <line x1="60" y1="0" x2="0" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">ELUX</text>
    <text x="30" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">dilution</text>
  </g>
  
  <g transform="translate(350, 150)">
    <!-- X 2 -->
    <line x1="0" y1="0" x2="60" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <line x1="60" y1="0" x2="0" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">CHTR</text>
    <text x="30" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">D/E 441 %</text>
  </g>
  
  <g transform="translate(500, 150)">
    <!-- X 3 -->
    <line x1="0" y1="0" x2="60" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <line x1="60" y1="0" x2="0" y2="60" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">ORCL</text>
    <text x="30" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">P/E 26</text>
  </g>
  
  <!-- Question mark for watched -->
  <g transform="translate(100, 300)">
    <text x="30" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#40826D">?</text>
    <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#40826D">FISV</text>
    <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">følger</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff">Rygtebørsen: afviste navne</text>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Redaktionelt diagram · Nye Sider</text>
</svg>
