<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  <text x="300" y="25" fill="#C9A227" font-family="Georgia, serif" font-size="16" text-anchor="middle">Porteføljen: 29 aktive kandidater</text>
  <!-- Six rows of circles representing issues -->
  <g transform="translate(30, 45)">
    <text x="0" y="15" fill="#40826D" font-family="Arial" font-size="10">Nr. 1:</text>
    <circle cx="70" cy="10" r="8" fill="#C9A227"/><circle cx="95" cy="10" r="8" fill="#C9A227"/><circle cx="120" cy="10" r="8" fill="#C9A227"/><circle cx="145" cy="10" r="8" fill="#C9A227"/>
    <text x="170" y="15" fill="#888888" font-family="Arial" font-size="9">NOVO-B, ZTS, RI.PA, BMW</text>
    
    <text x="0" y="40" fill="#40826D" font-family="Arial" font-size="10">Nr. 2:</text>
    <circle cx="70" cy="35" r="8" fill="#C9A227"/><circle cx="95" cy="35" r="8" fill="#C9A227"/><circle cx="120" cy="35" r="8" fill="#C9A227"/><circle cx="145" cy="35" r="8" fill="#C9A227"/>
    <text x="170" y="40" fill="#888888" font-family="Arial" font-size="9">PYPL, YAR, HUSQ-B, AD</text>
    
    <text x="0" y="65" fill="#40826D" font-family="Arial" font-size="10">Nr. 3:</text>
    <circle cx="70" cy="60" r="8" fill="#E8B4B8"/><circle cx="95" cy="60" r="8" fill="#C9A227"/><circle cx="120" cy="60" r="8" fill="#C9A227"/><circle cx="145" cy="60" r="8" fill="#C9A227"/><circle cx="170" cy="60" r="8" fill="#C9A227"/>
    <text x="195" y="65" fill="#888888" font-family="Arial" font-size="9">NKE⚠️, DECK, BSX, VOLCAR, MBG</text>
    
    <text x="0" y="90" fill="#40826D" font-family="Arial" font-size="10">Nr. 4:</text>
    <circle cx="70" cy="85" r="8" fill="#C9A227"/><circle cx="95" cy="85" r="8" fill="#C9A227"/><circle cx="120" cy="85" r="8" fill="#C9A227"/><circle cx="145" cy="85" r="8" fill="#C9A227"/><circle cx="170" cy="85" r="8" fill="#C9A227"/>
    <text x="195" y="90" fill="#888888" font-family="Arial" font-size="9">CMCSA, STZ, CAP, WKL, ROCK-B</text>
    
    <text x="0" y="115" fill="#40826D" font-family="Arial" font-size="10">Nr. 5:</text>
    <circle cx="70" cy="110" r="8" fill="#C9A227"/><circle cx="95" cy="110" r="8" fill="#C9A227"/><circle cx="120" cy="110" r="8" fill="#C9A227"/><circle cx="145" cy="110" r="8" fill="#C9A227"/><circle cx="170" cy="110" r="8" fill="#C9A227"/>
    <text x="195" y="115" fill="#888888" font-family="Arial" font-size="9">ADBE, UPS, SAN, TEL, DTE</text>
    
    <text x="0" y="140" fill="#40826D" font-family="Arial" font-size="10" font-weight="bold">Nr. 6:</text>
    <circle cx="70" cy="135" r="8" fill="#40826D"/><circle cx="95" cy="135" r="8" fill="#40826D"/><circle cx="120" cy="135" r="8" fill="#40826D"/><circle cx="145" cy="135" r="8" fill="#40826D"/><circle cx="170" cy="135" r="8" fill="#40826D"/>
    <text x="195" y="140" fill="#FFFFFF" font-family="Arial" font-size="9" font-weight="bold">INTU, PEP, LOW, ORK, PHIA (NY)</text>
  </g>
  <text x="300" y="220" fill="#C9A227" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">24 + 5 = 29 kandidater</text>
  <text x="300" y="245" fill="#E8B4B8" font-family="Arial" font-size="11" text-anchor="middle">⚠️ NKE: Q1 FY27 i morgen (29. sep) — BINÆRT</text>
  <text x="300" y="270" fill="#888888" font-family="Arial" font-size="10" text-anchor="middle">LULU invalideret i nr. 3. Ingen andre exits.</text>
</svg>