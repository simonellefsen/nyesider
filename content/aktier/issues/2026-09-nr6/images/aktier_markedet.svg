<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  <text x="300" y="30" fill="#C9A227" font-family="Georgia, serif" font-size="16" text-anchor="middle">Indeks vs. Enkeltnavn: % fra 52-ugers top</text>
  <!-- Index bars (small, green) -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="30" height="20" fill="#40826D" rx="3"/>
    <text x="40" y="15" fill="#FFFFFF" font-family="Arial" font-size="11">SPY: −1,0%</text>
    <rect x="0" y="30" width="25" height="20" fill="#40826D" rx="3"/>
    <text x="40" y="45" fill="#FFFFFF" font-family="Arial" font-size="11">QQQ: −0,6%</text>
    <rect x="0" y="60" width="28" height="20" fill="#40826D" rx="3"/>
    <text x="40" y="75" fill="#FFFFFF" font-family="Arial" font-size="11">EUNL: −0,7%</text>
  </g>
  <!-- Stock bars (large, gold) -->
  <g transform="translate(300, 60)">
    <rect x="0" y="0" width="200" height="28" fill="#C9A227" rx="3"/>
    <text x="10" y="19" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">INTU: −60,8%</text>
    <rect x="0" y="38" width="115" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
    <text x="10" y="57" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">LOW: −35,4%</text>
    <rect x="0" y="76" width="95" height="28" fill="#C9A227" rx="3" opacity="0.7"/>
    <text x="10" y="95" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">ORK: −28,8%</text>
    <rect x="0" y="114" width="82" height="28" fill="#C9A227" rx="3" opacity="0.6"/>
    <text x="10" y="133" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">PEP: −25,0%</text>
    <rect x="0" y="152" width="70" height="28" fill="#C9A227" rx="3" opacity="0.5"/>
    <text x="10" y="171" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">PHIA: −21,0%</text>
  </g>
  <text x="300" y="280" fill="#888888" font-family="Arial" font-size="10" text-anchor="middle">Grøn = indeks (tæt på top). Guld = kandidater (vasket ud).</text>
</svg>