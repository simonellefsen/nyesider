<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  <text x="300" y="35" fill="#C9A227" font-family="Georgia, serif" font-size="18" text-anchor="middle" font-weight="bold">NUMMER 6 · SEPTEMBER 2026</text>
  <g transform="translate(50, 70)">
    <!-- Five down arrows representing the five candidates -->
    <g transform="translate(0, 0)">
      <polygon points="50,0 100,80 75,80 75,120 25,120 25,80 0,80" fill="#C9A227" opacity="0.9"/>
      <text x="50" y="145" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">INTU</text>
      <text x="50" y="160" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">−61%</text>
    </g>
    <g transform="translate(100, 30)">
      <polygon points="50,0 90,60 70,60 70,90 30,90 30,60 10,60" fill="#C9A227" opacity="0.8"/>
      <text x="50" y="115" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">LOW</text>
      <text x="50" y="130" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">−35%</text>
    </g>
    <g transform="translate(200, 40)">
      <polygon points="50,0 85,50 68,50 68,80 32,80 32,50 15,50" fill="#C9A227" opacity="0.7"/>
      <text x="50" y="105" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">ORK</text>
      <text x="50" y="120" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">−29%</text>
    </g>
    <g transform="translate(300, 50)">
      <polygon points="50,0 80,40 65,40 65,70 35,70 35,40 20,40" fill="#C9A227" opacity="0.6"/>
      <text x="50" y="95" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">PEP</text>
      <text x="50" y="110" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">−25%</text>
    </g>
    <g transform="translate(400, 55)">
      <polygon points="50,0 75,35 63,35 63,65 37,65 37,35 25,35" fill="#C9A227" opacity="0.5"/>
      <text x="50" y="90" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">PHIA</text>
      <text x="50" y="105" fill="#888888" font-family="Arial" font-size="9" text-anchor="middle">−21%</text>
    </g>
  </g>
  <text x="300" y="280" fill="#888888" font-family="Arial" font-size="10" text-anchor="middle">Fem kandidater solgt hårdt fra toppen</text>
