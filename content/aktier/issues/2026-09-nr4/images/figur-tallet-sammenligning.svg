<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <text x="300" y="25" fill="#0D1B2A" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Fem kandidater: P/E og drawdown</text>
  <!-- Chart area -->
  <g transform="translate(80,50)">
    <!-- X-axis (P/E) -->
    <line x1="0" y1="200" x2="450" y2="200" stroke="#333" stroke-width="1"/>
    <text x="225" y="230" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">P/E (trailing eller forward)</text>
    <text x="0" y="215" fill="#666" font-family="Arial" font-size="9">6</text>
    <text x="150" y="215" fill="#666" font-family="Arial" font-size="9">9</text>
    <text x="300" y="215" fill="#666" font-family="Arial" font-size="9">12</text>
    <text x="450" y="215" fill="#666" font-family="Arial" font-size="9">15</text>
    <!-- Y-axis (drawdown) -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#333" stroke-width="1"/>
    <text x="-15" y="100" fill="#666" font-family="Arial" font-size="10" text-anchor="middle" transform="rotate(-90,-15,100)">Drawdown fra 52w top</text>
    <text x="-5" y="10" fill="#666" font-family="Arial" font-size="9" text-anchor="end">20%</text>
    <text x="-5" y="60" fill="#666" font-family="Arial" font-size="9" text-anchor="end">30%</text>
    <text x="-5" y="110" fill="#666" font-family="Arial" font-size="9" text-anchor="end">40%</text>
    <text x="-5" y="160" fill="#666" font-family="Arial" font-size="9" text-anchor="end">50%</text>
    <!-- Data points -->
    <!-- CMCSA: P/E 8.08, -23% -->
    <circle cx="70" cy="30" r="12" fill="#C9A227" opacity="0.8"/>
    <text x="70" y="34" fill="#0D1B2A" font-family="Arial" font-size="8" text-anchor="middle">CMCSA</text>
    <!-- STZ: P/E 11.67, -27% -->
    <circle cx="280" cy="55" r="12" fill="#C9A227" opacity="0.8"/>
    <text x="280" y="59" fill="#0D1B2A" font-family="Arial" font-size="8" text-anchor="middle">STZ</text>
    <!-- CAP.PA: fwd P/E 7.5, -33% -->
    <circle cx="50" cy="75" r="12" fill="#C9A227" opacity="0.8"/>
    <text x="50" y="79" fill="#0D1B2A" font-family="Arial" font-size="8" text-anchor="middle">CAP</text>
    <!-- WKL.AS: P/E 11.3, -44% -->
    <circle cx="265" cy="130" r="12" fill="#FF6666" opacity="0.8"/>
    <text x="265" y="134" fill="#0D1B2A" font-family="Arial" font-size="8" text-anchor="middle">WKL</text>
    <!-- ROCK-B: fwd P/E 12.6, -22% -->
    <circle cx="330" cy="20" r="12" fill="#40826D" opacity="0.8"/>
    <text x="330" y="24" fill="#fff" font-family="Arial" font-size="8" text-anchor="middle">ROCK</text>
  </g>
  <!-- Legend -->
  <text x="500" y="265" fill="#C9A227" font-family="Arial" font-size="9">Ï US/EU</text>
  <text x="550" y="265" fill="#40826D" font-family="Arial" font-size="9">Ï CPH</text>
  <text x="300" y="285" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">Kilde: Yahoo Finance · 11. sep 2026</text>
</svg>
