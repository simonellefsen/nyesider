<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="35" fill="#C9A227" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">CAP.PA</text>
  <text x="200" y="55" fill="#888" font-family="Arial" font-size="12" text-anchor="middle">Capgemini · Euronext Paris</text>
  <!-- IT consulting icons -->
  <g transform="translate(120,75)">
    <!-- Laptop -->
    <rect x="0" y="20" width="60" height="40" rx="3" fill="none" stroke="#C9A227" stroke-width="2"/>
    <rect x="-5" y="60" width="70" height="8" rx="2" fill="none" stroke="#C9A227" stroke-width="2"/>
    <!-- Code brackets -->
    <text x="30" y="48" fill="#40826D" font-family="monospace" font-size="20" text-anchor="middle">&lt;/&gt;</text>
    <!-- Cloud -->
    <ellipse cx="120" cy="40" rx="30" ry="20" fill="none" stroke="#40826D" stroke-width="2"/>
    <ellipse cx="100" cy="50" rx="20" ry="15" fill="none" stroke="#40826D" stroke-width="2"/>
    <ellipse cx="140" cy="50" rx="20" ry="15" fill="none" stroke="#40826D" stroke-width="2"/>
  </g>
  <text x="200" y="165" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">IT-services · 350.000+ ansatte</text>
  <!-- Key metrics -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="120" height="30" rx="5" fill="#1B3A4B" stroke="#C9A227"/>
    <text x="60" y="20" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">Fwd P/E 7,5</text>
  </g>
  <g transform="translate(220,185)">
    <rect x="0" y="0" width="120" height="30" rx="5" fill="#1B3A4B" stroke="#40826D"/>
    <text x="60" y="20" fill="#40826D" font-family="Arial" font-size="12" text-anchor="middle">Yield 3,3%</text>
  </g>
  <text x="200" y="250" fill="#FF6666" font-family="Arial" font-size="14" text-anchor="middle">32,8% fra 52w top</text>
  <text x="200" y="280" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">CORE · Fit-for-Growth + ordrebog vokser</text>
</svg>
