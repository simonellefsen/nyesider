<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Five dip arrows -->
  <g transform="translate(30,60)">
    <path d="M30,0 L30,60 L15,45 M30,60 L45,45" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="85" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">CMCSA</text>
    <text x="30" y="100" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">-23%</text>
  </g>
  <g transform="translate(95,50)">
    <path d="M30,0 L30,70 L15,55 M30,70 L45,55" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="95" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">STZ</text>
    <text x="30" y="110" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">-27%</text>
  </g>
  <g transform="translate(160,40)">
    <path d="M30,0 L30,85 L15,70 M30,85 L45,70" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="110" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">CAP.PA</text>
    <text x="30" y="125" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">-33%</text>
  </g>
  <g transform="translate(225,25)">
    <path d="M30,0 L30,110 L15,95 M30,110 L45,95" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="135" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">WKL.AS</text>
    <text x="30" y="150" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">-44%</text>
  </g>
  <g transform="translate(290,65)">
    <path d="M30,0 L30,55 L15,40 M30,55 L45,40" stroke="#40826D" stroke-width="3" fill="none"/>
    <text x="30" y="80" fill="#40826D" font-family="Arial" font-size="11" text-anchor="middle">ROCK</text>
    <text x="30" y="95" fill="#666" font-family="Arial" font-size="9" text-anchor="middle">-22%</text>
  </g>
  <!-- Note about Rockwool -->
  <text x="200" y="210" fill="#5588AA" font-family="Arial" font-size="11" text-anchor="middle">Første rene CPH-kandidat udover Novo</text>
  <text x="200" y="250" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">Fem nye dips</text>
  <text x="200" y="280" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">Nr. 4 · September 2026</text>
</svg>
