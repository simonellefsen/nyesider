<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="25" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Porteføljen: 19 kandidater</text>
  <!-- Nr. 1 row -->
  <text x="30" y="55" fill="#888" font-family="Arial" font-size="10">Nr.1:</text>
  <g transform="translate(70,40)">
    <circle cx="15" cy="10" r="12" fill="#40826D"/>
    <text x="15" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">NOVO</text>
    <circle cx="50" cy="10" r="12" fill="#40826D"/>
    <text x="50" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">ZTS</text>
    <circle cx="85" cy="10" r="12" fill="#40826D"/>
    <text x="85" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">RI.PA</text>
    <circle cx="120" cy="10" r="12" fill="#40826D"/>
    <text x="120" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">BMW</text>
  </g>
  <!-- Nr. 2 row -->
  <text x="30" y="90" fill="#888" font-family="Arial" font-size="10">Nr.2:</text>
  <g transform="translate(70,75)">
    <circle cx="15" cy="10" r="12" fill="#40826D"/>
    <text x="15" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">PYPL</text>
    <circle cx="50" cy="10" r="12" fill="#40826D"/>
    <text x="50" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">YAR</text>
    <circle cx="85" cy="10" r="12" fill="#40826D"/>
    <text x="85" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">HUSQ</text>
    <circle cx="120" cy="10" r="12" fill="#40826D"/>
    <text x="120" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">AD</text>
  </g>
  <!-- Nr. 3 row -->
  <text x="30" y="125" fill="#888" font-family="Arial" font-size="10">Nr.3:</text>
  <g transform="translate(70,110)">
    <circle cx="15" cy="10" r="12" fill="#40826D"/>
    <text x="15" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">NKE</text>
    <circle cx="50" cy="10" r="12" fill="#40826D"/>
    <text x="50" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">DECK</text>
    <circle cx="85" cy="10" r="12" fill="#40826D"/>
    <text x="85" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">BSX</text>
    <circle cx="120" cy="10" r="12" fill="#40826D"/>
    <text x="120" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">VOL</text>
    <circle cx="155" cy="10" r="12" fill="#40826D"/>
    <text x="155" y="14" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">MBG</text>
  </g>
  <!-- Nr. 4 row (new!) -->
  <text x="30" y="160" fill="#C9A227" font-family="Arial" font-size="10" font-weight="bold">Nr.4:</text>
  <g transform="translate(70,145)">
    <circle cx="15" cy="10" r="12" fill="#C9A227"/>
    <text x="15" y="14" fill="#0D1B2A" font-family="Arial" font-size="6" text-anchor="middle">CMCSA</text>
    <circle cx="50" cy="10" r="12" fill="#C9A227"/>
    <text x="50" y="14" fill="#0D1B2A" font-family="Arial" font-size="7" text-anchor="middle">STZ</text>
    <circle cx="85" cy="10" r="12" fill="#C9A227"/>
    <text x="85" y="14" fill="#0D1B2A" font-family="Arial" font-size="6" text-anchor="middle">CAP.PA</text>
    <circle cx="120" cy="10" r="12" fill="#C9A227"/>
    <text x="120" y="14" fill="#0D1B2A" font-family="Arial" font-size="6" text-anchor="middle">WKL</text>
    <circle cx="155" cy="10" r="12" fill="#40826D"/>
    <text x="155" y="14" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">ROCK</text>
  </g>
  <!-- Summary -->
  <text x="200" y="200" fill="#40826D" font-family="Arial" font-size="12" text-anchor="middle">14 fra nr.1+2+3 holder</text>
  <text x="200" y="220" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">+ 5 nye fra nr.4</text>
  <text x="200" y="250" fill="#888" font-family="Arial" font-size="11" text-anchor="middle">Ingen nye invalidationer</text>
  <text x="200" y="280" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">Næste: Nike Q1 (29. sep)</text>
</svg>
