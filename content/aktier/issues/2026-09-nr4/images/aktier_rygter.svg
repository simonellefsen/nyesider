<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="30" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Rygtebørsen: afvist eller følger</text>
  <!-- Rejected with X marks -->
  <g transform="translate(40,55)">
    <!-- FISV -->
    <text x="0" y="15" fill="#FF6666" font-family="Arial" font-size="11"> FISV</text>
    <text x="60" y="15" fill="#888" font-family="Arial" font-size="9">62%, falling knife</text>
    <!-- UPS -->
    <text x="0" y="40" fill="#C9A227" font-family="Arial" font-size="11">~ UPS</text>
    <text x="60" y="40" fill="#888" font-family="Arial" font-size="9">18%, under screen</text>
    <!-- DG -->
    <text x="0" y="65" fill="#FF6666" font-family="Arial" font-size="11"> DG</text>
    <text x="60" y="65" fill="#888" font-family="Arial" font-size="9">P/E ~16, ikke billig nok</text>
    <!-- BALD-B -->
    <text x="0" y="90" fill="#FF6666" font-family="Arial" font-size="11"> BALD-B</text>
    <text x="60" y="90" fill="#888" font-family="Arial" font-size="9">illikvid, gearet</text>
    <!-- CHTR -->
    <text x="0" y="115" fill="#FF6666" font-family="Arial" font-size="11"> CHTR</text>
    <text x="60" y="115" fill="#888" font-family="Arial" font-size="9">D/E 441%, leverage veto</text>
  </g>
  <g transform="translate(220,55)">
    <!-- CPB/CAG/GIS -->
    <text x="0" y="15" fill="#FF6666" font-family="Arial" font-size="11"> CPB/CAG/GIS</text>
    <text x="0" y="30" fill="#888" font-family="Arial" font-size="9">value-trap zone</text>
    <!-- STLAP/ELUX -->
    <text x="0" y="55" fill="#FF6666" font-family="Arial" font-size="11"> STLAP/ELUX</text>
    <text x="0" y="70" fill="#888" font-family="Arial" font-size="9">traps</text>
    <!-- RNO/VOW3 -->
    <text x="0" y="95" fill="#FF6666" font-family="Arial" font-size="11"> RNO/VOW3</text>
    <text x="0" y="110" fill="#888" font-family="Arial" font-size="9">auto-overlap</text>
    <!-- DK names -->
    <text x="0" y="135" fill="#C9A227" font-family="Arial" font-size="11">~ COLO/AMBU/GN</text>
    <text x="0" y="150" fill="#888" font-family="Arial" font-size="9">solgt ned, men dyre</text>
  </g>
  <!-- Summary -->
  <text x="200" y="230" fill="#FF6666" font-family="Arial" font-size="12" text-anchor="middle"> = afvist</text>
  <text x="200" y="250" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">~ = følger / nær-miss</text>
  <text x="200" y="280" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">FISV: følger · UPS: nær-miss</text>
</svg>
