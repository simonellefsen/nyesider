  <text x="200" y="270" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">Kilde: Yahoo Finance · 11. sep 2026</text>
  <text x="200" y="290" fill="#C9A227" font-family="Arial" font-size="11" text-anchor="middle">Stadig ingen rabat i indekset</text>
