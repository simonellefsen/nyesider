<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  
  <!-- Title -->
  <text x="300" y="35" fill="#C9A227" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Følgelisten og Rygtebørsen</text>
  
  <!-- Follower boxes -->
  <rect x="40" y="55" width="120" height="80" fill="#1E3A5F" rx="6"/>
  <text x="100" y="80" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TMUS</text>
  <text x="100" y="100" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">−7,9 %</text>
  <text x="100" y="120" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">52w low</text>
  
  <rect x="170" y="55" width="120" height="80" fill="#1E3A5F" rx="6"/>
  <text x="230" y="80" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">T (AT&amp;T)</text>
  <text x="230" y="100" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">−10,7 %</text>
  <text x="230" y="120" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">SpaceX-rygte</text>
  
  <rect x="300" y="55" width="140" height="80" fill="#1E3A5F" rx="6"/>
  <text x="370" y="80" fill="#C9A227" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FISV / FIS</text>
  <text x="370" y="100" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Højere lav</text>
  <text x="370" y="120" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Q3 3.–4. nov</text>
  
  <rect x="450" y="55" width="110" height="80" fill="#1E3A5F" rx="6"/>
  <text x="505" y="80" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BOL.ST</text>
  <text x="505" y="100" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">−9,4 %</text>
  <text x="505" y="120" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Q3 29. okt</text>
  
  <!-- Rejections -->
  <rect x="40" y="150" width="520" height="60" fill="#1E3A5F" rx="6"/>
  <text x="300" y="175" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Afviste</text>
  <text x="300" y="195" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">MKC (fwd P/E 15) · CPB (value-trap) · NHY.OL (ingen bund) · EU-banker (RSI &lt;30)</text>
  
  <!-- Bottom -->
  <text x="300" y="240" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Telekom følger — ingen bekræftet bund</text>
  <text x="300" y="260" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Fintech venter på regnskab</text>
  <text x="300" y="280" fill="#C9A227" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Ingen ny kandidat fra København eller Oslo</text>
</svg>