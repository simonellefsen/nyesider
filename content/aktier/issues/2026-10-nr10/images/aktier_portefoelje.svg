<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  
  <!-- Title -->
  <text x="300" y="35" fill="#C9A227" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Porteføljen — scorecard 23. okt 2026</text>
  
  <!-- Main boxes -->
  <rect x="40" y="55" width="160" height="90" fill="#1E3A5F" rx="6"/>
  <text x="120" y="80" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Alle 32 kandidater</text>
  <text x="120" y="115" fill="#40826D" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">+1,4 %</text>
  <text x="120" y="135" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">17 af 32 i plus</text>
  
  <rect x="220" y="55" width="160" height="90" fill="#1E3A5F" rx="6"/>
  <text x="300" y="80" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">22 aktive</text>
  <text x="300" y="115" fill="#40826D" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">+5,1 %</text>
  <text x="300" y="135" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">14 af 22 i plus</text>
  
  <rect x="400" y="55" width="160" height="90" fill="#1E3A5F" rx="6"/>
  <text x="480" y="80" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sidste uge</text>
  <text x="480" y="115" fill="#40826D" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">+2,2 %</text>
  <text x="480" y="135" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">18 af 22 i plus</text>
  
  <!-- Best/Worst -->
  <rect x="40" y="160" width="250" height="70" fill="#1E3A5F" rx="6"/>
  <text x="165" y="185" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Bedste aktive</text>
  <text x="165" y="210" fill="#40826D" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">WKL +33 % · ACN +25 % · INTU +25 %</text>
  
  <rect x="310" y="160" width="250" height="70" fill="#1E3A5F" rx="6"/>
  <text x="435" y="185" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">BKNG</text>
  <text x="435" y="210" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1,1 % over niveau — Q3 3. nov BINÆRT</text>
  
  <!-- Bottom -->
  <text x="300" y="260" fill="#C9A227" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ingen invalidationer · 23 aktive efter Balder</text>
  <text x="300" y="280" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">IT-services-klynge bærer stadig scoren — koncentrationsrisiko</text>
</svg>