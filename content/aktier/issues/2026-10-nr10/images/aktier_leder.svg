<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#0D1B2A"/>
  
  <!-- Left column: Volvo Car -->
  <rect x="40" y="60" width="230" height="200" fill="#1E3A5F" rx="8"/>
  <text x="155" y="95" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VOLCAR-B.ST</text>
  <text x="155" y="130" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">−24,6 %</text>
  <text x="155" y="155" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">på en uge</text>
  <text x="155" y="185" fill="#C9A227" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Exit nr. 7 holdt</text>
  <text x="155" y="205" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">−43 % vs entry</text>
  <text x="155" y="240" fill="#40826D" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Single-close ✓</text>
  
  <!-- Right column: Balder -->
  <rect x="330" y="60" width="230" height="200" fill="#1E3A5F" rx="8"/>
  <text x="445" y="95" fill="#40826D" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BALD-B.ST</text>
  <text x="445" y="130" fill="#40826D" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">~50 %</text>
  <text x="445" y="155" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">af NAV</text>
  <text x="445" y="185" fill="#C9A227" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Q3 i linje</text>
  <text x="445" y="205" fill="#8B9DC3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Lejeindtægter +6 %</text>
  <text x="445" y="240" fill="#40826D" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">SATELLITE ✓</text>
  
  <!-- Title -->
  <text x="300" y="35" fill="#C9A227" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ugens kontrast</text>
</svg>