<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Stylized downtrend with binary fork -->
  <g transform="translate(100, 80)">
    <line x1="0" y1="320" x2="600" y2="320" stroke="#1a2d42" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#1a2d42" stroke-width="1"/>
    
    <!-- Price line showing steep fall -->
    <path d="M0 30 L150 0 L300 200 L450 280 L550 270" 
          stroke="#C9A227" stroke-width="3" fill="none"/>
    
    <!-- Binary fork at current point -->
    <circle cx="550" cy="270" r="8" fill="#40826D"/>
    
    <!-- Up scenario (dashed) -->
    <path d="M550 270 L600 180" stroke="#40826D" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="610" y="175" font-family="monospace" font-size="11" fill="#40826D">Guide ‘</text>
    
    <!-- Down scenario (dashed) -->
    <path d="M550 270 L600 320" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="610" y="325" font-family="monospace" font-size="11" fill="#888">Guide “</text>
    
    <!-- High marker -->
    <circle cx="150" cy="0" r="5" fill="#C9A227" opacity="0.6"/>
    <text x="150" y="-15" text-anchor="middle" font-family="monospace" font-size="11" fill="#C9A227">$225,98</text>
    
    <!-- Current price -->
    <text x="550" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#40826D">$120,81</text>
  </g>
  
  <!-- Ticker badge -->
  <rect x="50" y="40" width="100" height="45" fill="#40826D" rx="4"/>
  <text x="100" y="70" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#fff">LULU</text>
  
  <!-- Key date -->
  <g transform="translate(550, 40)">
    <rect x="0" y="0" width="180" height="50" fill="#1a2d42" rx="4" stroke="#C9A227" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Næste regnskab</text>
    <text x="90" y="42" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227" font-weight="bold">3. september</text>
  </g>
  
  <!-- Metrics -->
  <g transform="translate(200, 50)" font-family="Arial, sans-serif" font-size="12">
    <text x="0" y="0" fill="#888">P/E 9,31</text>
    <text x="80" y="0" fill="#888">|</text>
    <text x="100" y="0" fill="#888">46,5 %</text>
    <text x="170" y="0" fill="#888">|</text>
    <text x="190" y="0" fill="#888">Short 10 %</text>
  </g>
  
  <!-- Sleeve badges -->
  <rect x="600" y="440" width="90" height="25" fill="#C9A227" rx="3"/>
  <text x="645" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2A">SATELLITE</text>
  
  <rect x="700" y="440" width="70" height="25" fill="#888" rx="3"/>
  <text x="735" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">BINARY</text>
  
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Redaktionelt diagram · Nye Sider · 28. aug 2026</text>
</svg>
