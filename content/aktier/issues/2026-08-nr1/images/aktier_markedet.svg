<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Grid lines -->
  <g stroke="#1a2d42" stroke-width="1">
    <line x1="100" y1="100" x2="100" y2="400"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="300" x2="700" y2="300" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="100" y1="200" x2="700" y2="200" stroke-dasharray="5,5" opacity="0.5"/>
  </g>
  
  <!-- Bar chart showing % from 52w high -->
  <g fill="#C9A227">
    <!-- S&P 500: -1.3% -->
    <rect x="130" y="387" width="70" height="13" rx="2"/>
    <!-- Nasdaq: -2.9% -->
    <rect x="230" y="371" width="70" height="29" rx="2"/>
    <!-- STOXX: -1.2% -->
    <rect x="330" y="388" width="70" height="12" rx="2"/>
    <!-- DAX: -0.2% -->
    <rect x="430" y="398" width="70" height="2" rx="1"/>
    <!-- OMXC25: -1.1% -->
    <rect x="530" y="389" width="70" height="11" rx="2"/>
    <!-- OMXS30: -0.5% -->
    <rect x="630" y="395" width="70" height="5" rx="1"/>
  </g>
  
  <!-- Labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">
    <text x="165" y="420">S&amp;P</text>
    <text x="265" y="420">NASDAQ</text>
    <text x="365" y="420">STOXX</text>
    <text x="465" y="420">DAX</text>
    <text x="565" y="420">OMXC25</text>
    <text x="665" y="420">OMXS30</text>
  </g>
  
  <!-- Percentage labels -->
  <g font-family="monospace" font-size="11" fill="#C9A227" text-anchor="middle">
    <text x="165" y="380">1,3 %</text>
    <text x="265" y="365">2,9 %</text>
    <text x="365" y="382">1,2 %</text>
    <text x="465" y="392">0,2 %</text>
    <text x="565" y="383">1,1 %</text>
    <text x="665" y="389">0,5 %</text>
  </g>
  
  <!-- Zero line label -->
  <text x="90" y="404" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#888">52w top</text>
  
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#fff">Indekserne er tæt på toppen</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">28. august 2026 · Afstand fra 52-ugers højeste</text>
  
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Redaktionelt diagram · Nye Sider · Kilde: Yahoo Finance</text>
</svg>
