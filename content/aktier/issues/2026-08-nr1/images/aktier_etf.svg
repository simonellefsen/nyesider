<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff">ETF'erne er tæt på toppen</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Ingen er en bedre kandidat end enkeltaktierne</text>
  
  <!-- Grid of ETF boxes -->
  <g transform="translate(80, 110)">
    <!-- Row 1: US -->
    <rect x="0" y="0" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#40826D">SPY</text>
    <text x="75" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">$769,35</text>
    <text x="75" y="70" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227">1,3 %</text>
    
    <rect x="170" y="0" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="245" y="25" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#40826D">QQQ</text>
    <text x="245" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">$716,43</text>
    <text x="245" y="70" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227">4,3 %</text>
    
    <!-- Row 2: Europe -->
    <rect x="0" y="100" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="75" y="125" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#40826D">EUNL</text>
    <text x="75" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">¬128,22</text>
    <text x="75" y="170" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227">1,2 %</text>
    
    <rect x="170" y="100" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="245" y="125" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#40826D">EXS1</text>
    <text x="245" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">¬218,95</text>
    <text x="245" y="170" text-anchor="middle" font-family="monospace" font-size="14" fill="#888">0,2 %</text>
    
    <!-- Row 3: Nordic -->
    <rect x="0" y="200" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="75" y="225" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#40826D">XACTC25</text>
    <text x="75" y="250" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">DKK 214</text>
    <text x="75" y="270" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227">0,7 %</text>
    
    <rect x="170" y="200" width="150" height="80" fill="#1a2d42" rx="4"/>
    <text x="245" y="225" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#40826D">OMXS30</text>
    <text x="245" y="250" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">SEK 496</text>
    <text x="245" y="270" text-anchor="middle" font-family="monospace" font-size="14" fill="#C9A227">0,8 %</text>
  </g>
  
  <!-- Note about XACTC25 -->
  <g transform="translate(400, 150)">
    <rect x="0" y="0" width="320" height="130" fill="#1a2d42" rx="4" stroke="#C9A227" stroke-width="1"/>
    <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">Hvorfor ikke XACTC25?</text>
    <text x="160" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Novo udgør ~16 % af kurven.</text>
    <text x="160" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">ETF'en fortynder Novo-dippen.</text>
    <text x="160" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C9A227">’ Enkeltnavn giver fuld eksponering</text>
  </g>
  
  <!-- Bottom conclusion -->
  <rect x="400" y="330" width="320" height="60" fill="#40826D" opacity="0.2" rx="4"/>
  <text x="560" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#40826D">Rabat findes kun i enkeltnavn,</text>
  <text x="560" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#40826D">ikke i ETF'er nær 52w-top</text>
  
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Redaktionelt diagram · Nye Sider · 28. aug 2026</text>
</svg>
