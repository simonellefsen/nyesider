<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Stylized base formation -->
  <g transform="translate(100, 80)">
    <line x1="0" y1="320" x2="600" y2="320" stroke="#1a2d42" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#1a2d42" stroke-width="1"/>
    
    <!-- Price line showing fall then base -->
    <path d="M0 30 L100 0 L250 200 L350 280 L450 275 L550 280 L600 278" 
          stroke="#C9A227" stroke-width="3" fill="none"/>
    
    <!-- Base range highlight -->
    <rect x="350" y="270" width="250" height="20" fill="#40826D" opacity="0.2" rx="2"/>
    <text x="475" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#40826D">Base: 1,2 % over 3 mdr.</text>
    
    <!-- Current price marker -->
    <circle cx="600" cy="278" r="8" fill="#40826D"/>
    
    <!-- High marker -->
    <circle cx="100" cy="0" r="5" fill="#C9A227" opacity="0.6"/>
    <text x="100" y="-15" text-anchor="middle" font-family="monospace" font-size="11" fill="#C9A227">$155,38</text>
    
    <!-- Current price -->
    <text x="620" y="283" font-family="monospace" font-size="12" fill="#40826D">$77,34</text>
    <text x="620" y="300" font-family="monospace" font-size="10" fill="#888">50,2 %</text>
  </g>
  
  <!-- Ticker badge -->
  <rect x="50" y="40" width="80" height="45" fill="#40826D" rx="4"/>
  <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#fff">ZTS</text>
  
  <!-- Warning: D/E -->
  <g transform="translate(550, 40)">
    <rect x="0" y="0" width="180" height="50" fill="#1a2d42" rx="4" stroke="#888" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Gældsgrad (D/E)</text>
    <text x="90" y="40" text-anchor="middle" font-family="monospace" font-size="18" fill="#C9A227" font-weight="bold">294 %</text>
  </g>
  
  <!-- Metrics -->
  <g transform="translate(160, 60)" font-family="Arial, sans-serif" font-size="12">
    <text x="0" y="0" fill="#888">P/E 12,24</text>
    <text x="90" y="0" fill="#888">|</text>
    <text x="110" y="0" fill="#888">P/B 9,85 (ikke billig)</text>
  </g>
  
  <!-- Sleeve badge -->
  <rect x="680" y="440" width="90" height="25" fill="#C9A227" rx="3"/>
  <text x="725" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2A">SATELLITE</text>
  
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Redaktionelt diagram · Nye Sider · 28. aug 2026</text>
</svg>
