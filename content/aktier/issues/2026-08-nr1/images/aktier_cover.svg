<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1a2d42"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#coverGrad)"/>
  
  <!-- Abstract chart lines suggesting upward trend -->
  <g opacity="0.15">
    <path d="M0 800 Q200 750 400 700 T800 600" stroke="#C9A227" stroke-width="3" fill="none"/>
    <path d="M0 850 Q200 800 400 720 T800 650" stroke="#C9A227" stroke-width="2" fill="none"/>
    <path d="M0 900 Q200 850 400 780 T800 700" stroke="#C9A227" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Gold accent bar -->
  <rect x="50" y="150" width="8" height="120" fill="#C9A227"/>
  
  <!-- Title block -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#C9A227">AKTIER</text>
  <text x="80" y="260" font-family="Georgia, serif" font-size="32" fill="#fff">med Grok</text>
  
  <!-- Issue info -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="18" fill="#888">Nr. 1 · August 2026</text>
  
  <!-- Main headline -->
  <text x="80" y="450" font-family="Georgia, serif" font-size="42" fill="#fff">Fem kandidater</text>
  <text x="80" y="505" font-family="Georgia, serif" font-size="42" fill="#fff">i et marked</text>
  <text x="80" y="560" font-family="Georgia, serif" font-size="42" fill="#C9A227">uden bred nedtur</text>
  
  <!-- Five ticker boxes -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="120" height="50" fill="#40826D" rx="4"/>
    <text x="60" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">NOVO-B</text>
    
    <rect x="135" y="0" width="100" height="50" fill="#40826D" rx="4"/>
    <text x="185" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">LULU</text>
    
    <rect x="250" y="0" width="80" height="50" fill="#40826D" rx="4"/>
    <text x="290" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">ZTS</text>
    
    <rect x="345" y="0" width="90" height="50" fill="#40826D" rx="4"/>
    <text x="390" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">RI.PA</text>
    
    <rect x="450" y="0" width="100" height="50" fill="#40826D" rx="4"/>
    <text x="500" y="32" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">BMW</text>
  </g>
  
  <!-- Drawdown indicators -->
  <g transform="translate(80, 700)" font-family="Arial, sans-serif" font-size="14" fill="#C9A227">
    <text x="60" y="0" text-anchor="middle">28 %</text>
    <text x="185" y="0" text-anchor="middle">47 %</text>
    <text x="290" y="0" text-anchor="middle">50 %</text>
    <text x="390" y="0" text-anchor="middle">37 %</text>
    <text x="500" y="0" text-anchor="middle">36 %</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="80" y="900" font-family="Arial, sans-serif" font-size="16" fill="#888">Konkrete kandidater · Konkrete tal · Konkrete invalidationsniveauer</text>
</svg>
