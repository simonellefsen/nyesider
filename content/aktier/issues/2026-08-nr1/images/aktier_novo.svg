<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0D1B2A"/>
  
  <!-- Stylized price chart -->
  <g transform="translate(100, 100)">
    <!-- Grid -->
    <line x1="0" y1="300" x2="600" y2="300" stroke="#1a2d42" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#1a2d42" stroke-width="1"/>
    
    <!-- Price line showing fall and partial recovery -->
    <path d="M0 50 L100 30 L200 0 L300 180 L400 220 L500 190 L600 200" 
          stroke="#C9A227" stroke-width="3" fill="none"/>
    
    <!-- Current price marker -->
    <circle cx="600" cy="200" r="8" fill="#40826D"/>
    
    <!-- High point marker -->
    <circle cx="200" cy="0" r="5" fill="#C9A227" opacity="0.6"/>
    <text x="200" y="-15" text-anchor="middle" font-family="monospace" font-size="11" fill="#C9A227">DKK 409,95</text>
    
    <!-- Low point marker -->
    <circle cx="350" cy="230" r="5" fill="#888" opacity="0.6"/>
    <text x="350" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">DKK 224,25</text>
    
    <!-- Current price label -->
    <text x="620" y="205" font-family="monospace" font-size="14" fill="#40826D">DKK 295,50</text>
    <text x="620" y="225" font-family="monospace" font-size="11" fill="#888">27,9 %</text>
  </g>
  
  <!-- Ticker badge -->
  <rect x="50" y="40" width="140" height="45" fill="#40826D" rx="4"/>
  <text x="120" y="70" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#fff">NOVO-B</text>
  
  <!-- Key metrics -->
  <g transform="translate(550, 40)" font-family="Arial, sans-serif" font-size="12">
    <text x="0" y="0" fill="#888">P/E (trail)</text>
    <text x="100" y="0" fill="#C9A227" font-weight="bold">11,25</text>
    <text x="0" y="20" fill="#888">P/E (fwd)</text>
    <text x="100" y="20" fill="#C9A227">13,48</text>
    <text x="0" y="40" fill="#888">P/B</text>
    <text x="100" y="40" fill="#C9A227">5,90</text>
  </g>
  
  <!-- Sleeve badge -->
  <rect x="680" y="440" width="70" height="25" fill="#C9A227" rx="3"/>
  <text x="715" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2A">CORE</text>
  
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Redaktionelt diagram · Nye Sider · 28. aug 2026</text>
</svg>
