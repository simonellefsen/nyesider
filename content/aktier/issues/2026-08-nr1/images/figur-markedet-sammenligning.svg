<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 434" style="background:#0D1B2A">
  <defs>
    <style>
      .title { font-family: Georgia, serif; font-size: 16px; fill: #C9A227; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #888888; }
      .bar-label { font-family: Arial, sans-serif; font-size: 11px; fill: white; }
      .pct-label { font-family: Arial, sans-serif; font-size: 10px; fill: #C9A227; font-weight: bold; }
      .legend { font-family: Arial, sans-serif; font-size: 10px; fill: #888888; }
      .source { font-family: Arial, sans-serif; font-size: 9px; fill: #888888; }
    </style>
  </defs>
  
  <text x="80" y="25" class="title">Indeks ved toppen, kandidater solgt fra</text>
  <text x="80" y="45" class="subtitle">Afstand fra 52-ugers top — indeks vs. nummerets fem kandidater</text>
  
  <!-- Legend -->
  <rect x="620" y="15" width="12" height="12" fill="#40826D" rx="2"/>
  <text x="637" y="25" class="legend">Indeks</text>
  <rect x="700" y="15" width="12" height="12" fill="#C9A227" rx="2"/>
  <text x="717" y="25" class="legend">Kandidat</text>

  <rect x="80" y="70" width="2.8" height="28" fill="#40826D" rx="3" opacity="0.85"/>
  <text x="88" y="88.0" class="bar-label">DAX</text>
  <text x="90.8" y="88.0" class="pct-label">−0.3 %</text>

  <rect x="80" y="108" width="8.9" height="28" fill="#40826D" rx="3" opacity="0.85"/>
  <text x="88" y="126.0" class="bar-label">S&P 500</text>
  <text x="96.9" y="126.0" class="pct-label">−0.9 %</text>

  <rect x="80" y="146" width="12.8" height="28" fill="#40826D" rx="3" opacity="0.85"/>
  <text x="88" y="164.0" class="bar-label">OMXC25</text>
  <text x="100.8" y="164.0" class="pct-label">−1.3 %</text>

  <rect x="80" y="184" width="269.2" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
  <text x="88" y="202.0" class="bar-label">NOVO-B</text>
  <text x="357.2" y="202.0" class="pct-label">−26.4 %</text>

  <rect x="80" y="222" width="364.1" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
  <text x="88" y="240.0" class="bar-label">RI.PA</text>
  <text x="452.1" y="240.0" class="pct-label">−35.8 %</text>

  <rect x="80" y="260" width="391.7" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
  <text x="88" y="278.0" class="bar-label">BMW</text>
  <text x="479.7" y="278.0" class="pct-label">−38.5 %</text>

  <rect x="80" y="298" width="475.8" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
  <text x="88" y="316.0" class="bar-label">LULU</text>
  <text x="563.8" y="316.0" class="pct-label">−46.7 %</text>

  <rect x="80" y="336" width="529.8" height="28" fill="#C9A227" rx="3" opacity="0.85"/>
  <text x="88" y="354.0" class="bar-label">ZTS</text>
  <text x="617.8" y="354.0" class="pct-label">−52.0 %</text>

  <text x="80" y="419" class="source">Kilde: Yahoo Finance, 28. august 2026. Grøn = indeks (S&P, DAX, OMXC25). Guld = nummerets kandidater.</text>
</svg>