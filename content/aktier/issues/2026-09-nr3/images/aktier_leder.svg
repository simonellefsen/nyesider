<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Five dip arrows -->
  <g transform="translate(50,80)">
    <path d="M30,0 L30,80 L15,65 M30,80 L45,65" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="110" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">NKE</text>
    <text x="30" y="125" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">50%</text>
  </g>
  <g transform="translate(110,100)">
    <path d="M30,0 L30,60 L15,45 M30,60 L45,45" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="90" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">DECK</text>
    <text x="30" y="105" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">31%</text>
  </g>
  <g transform="translate(170,70)">
    <path d="M30,0 L30,90 L15,75 M30,90 L45,75" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="120" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">BSX</text>
    <text x="30" y="135" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">56%</text>
  </g>
  <g transform="translate(230,85)">
    <path d="M30,0 L30,75 L15,60 M30,75 L45,60" stroke="#C9A227" stroke-width="3" fill="none"/>
    <text x="30" y="105" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">VOLCAR</text>
    <text x="30" y="120" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">48%</text>
  </g>
  <g transform="translate(290,110)">
    <path d="M30,0 L30,50 L15,35 M30,50 L45,35" stroke="#40826D" stroke-width="3" fill="none"/>
    <text x="30" y="80" fill="#40826D" font-family="Arial" font-size="12" text-anchor="middle">MBG</text>
    <text x="30" y="95" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">24%</text>
  </g>
  <!-- LULU crossed out -->
  <g transform="translate(50,240)">
    <text fill="#FF4444" font-family="Arial" font-size="14" text-anchor="start">LULU invalideret</text>
    <line x1="0" y1="-5" x2="120" y2="-5" stroke="#FF4444" stroke-width="2"/>
  </g>
  <text x="200" y="280" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">Fem nye dips · September 2026</text>
</svg>
