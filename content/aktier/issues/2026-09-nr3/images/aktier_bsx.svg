    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Heart/medical symbol -->
  <path d="M200,80 C200,60 230,40 260,60 C290,80 290,120 200,180 C110,120 110,80 140,60 C170,40 200,60 200,80" 
