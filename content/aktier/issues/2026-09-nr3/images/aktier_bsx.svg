  <text x="200" y="210" fill="#C9A227" font-family="Arial" font-size="28" text-anchor="middle" font-weight="bold">$47,80</text>
  <text x="200" y="235" fill="#FF4444" font-family="Arial" font-size="16" text-anchor="middle">56,3% fra top</text>
