<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg)"/>
  <!-- Title -->
  <text x="300" y="25" fill="#0D1B2A" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Fem kandidater: nøgletal-sammenligning</text>
  
  <!-- P/E comparison -->
  <text x="30" y="60" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">P/E (trailing)</text>
  <g transform="translate(30,70)">
    <rect x="0" y="0" width="30" height="20" fill="#C9A227"/><text x="40" y="15" fill="#333" font-family="Arial" font-size="10">VOLCAR 5,9</text>
    <rect x="0" y="25" width="45" height="20" fill="#40826D"/><text x="55" y="40" fill="#333" font-family="Arial" font-size="10">MBG 8,9</text>
    <rect x="0" y="50" width="60" height="20" fill="#C9A227"/><text x="70" y="65" fill="#333" font-family="Arial" font-size="10">DECK 12</text>
    <rect x="0" y="75" width="90" height="20" fill="#C9A227"/><text x="100" y="90" fill="#333" font-family="Arial" font-size="10">NKE 18,3</text>
    <rect x="0" y="100" width="95" height="20" fill="#C9A227"/><text x="105" y="115" fill="#333" font-family="Arial" font-size="10">BSX 19</text>
  </g>
  
  <!-- P/B comparison -->
  <text x="220" y="60" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">P/B</text>
  <g transform="translate(220,70)">
    <rect x="0" y="0" width="18" height="20" fill="#C9A227"/><text x="28" y="15" fill="#333" font-family="Arial" font-size="10">VOLCAR 0,37</text>
    <rect x="0" y="25" width="25" height="20" fill="#40826D"/><text x="35" y="40" fill="#333" font-family="Arial" font-size="10">MBG 0,49</text>
    <rect x="0" y="50" width="135" height="20" fill="#C9A227"/><text x="145" y="65" fill="#333" font-family="Arial" font-size="10">BSX 2,7</text>
    <rect x="0" y="75" width="190" height="20" fill="#C9A227"/><text x="200" y="90" fill="#333" font-family="Arial" font-size="10">NKE 3,83</text>
    <rect x="0" y="100" width="250" height="20" fill="#C9A227"/><text x="260" y="115" fill="#333" font-family="Arial" font-size="10">DECK 5</text>
  </g>
  
  <!-- % from 52w high -->
  <text x="30" y="220" fill="#0D1B2A" font-family="Arial" font-size="12" font-weight="bold">Afstand fra 52w top</text>
  <g transform="translate(30,230)">
    <rect x="0" y="0" width="280" height="18" fill="#FF4444"/><text x="290" y="13" fill="#333" font-family="Arial" font-size="10">BSX 56%</text>
    <rect x="0" y="22" width="250" height="18" fill="#FF4444"/><text x="260" y="35" fill="#333" font-family="Arial" font-size="10">NKE 50%</text>
    <rect x="0" y="44" width="240" height="18" fill="#C9A227"/><text x="250" y="57" fill="#333" font-family="Arial" font-size="10">VOLCAR 48%</text>
    <rect x="0" y="66" width="155" height="18" fill="#C9A227"/><text x="165" y="79" fill="#333" font-family="Arial" font-size="10">DECK 31%</text>
    <rect x="0" y="88" width="117" height="18" fill="#40826D"/><text x="127" y="101" fill="#333" font-family="Arial" font-size="10">MBG 24%</text>
  </g>
  
  <!-- Legend -->
  <rect x="450" y="280" width="15" height="15" fill="#C9A227"/>
  <text x="470" y="292" fill="#333" font-family="Arial" font-size="10">SATELLITE</text>
  <rect x="450" y="300" width="15" height="15" fill="#40826D"/>
  <text x="470" y="312" fill="#333" font-family="Arial" font-size="10">YIELD</text>
  <rect x="450" y="320" width="15" height="15" fill="#FF4444"/>
  <text x="470" y="332" fill="#333" font-family="Arial" font-size="10">Stor rabat</text>
</svg>
