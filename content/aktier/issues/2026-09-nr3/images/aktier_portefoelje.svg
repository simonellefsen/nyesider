<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="25" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Porteføljen: 9 kandidater</text>
  <!-- Nr. 1 row -->
  <text x="30" y="55" fill="#666" font-family="Arial" font-size="10">Nr. 1:</text>
  <circle cx="80" cy="70" r="20" fill="#40826D"/>
  <text x="80" y="75" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">NOVO</text>
  <circle cx="130" cy="70" r="20" fill="#40826D"/>
  <text x="130" y="75" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">ZTS</text>
  <circle cx="180" cy="70" r="20" fill="#40826D"/>
  <text x="180" y="75" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">RI.PA</text>
  <circle cx="230" cy="70" r="20" fill="#40826D"/>
  <text x="230" y="75" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">BMW</text>
  <!-- LULU crossed out -->
  <circle cx="280" cy="70" r="20" fill="#333" stroke="#FF4444" stroke-width="2"/>
  <text x="280" y="75" fill="#FF4444" font-family="Arial" font-size="9" text-anchor="middle">LULU</text>
  <line x1="265" y1="55" x2="295" y2="85" stroke="#FF4444" stroke-width="2"/>
  <text x="330" y="75" fill="#FF4444" font-family="Arial" font-size="9">UDE</text>
  
  <!-- Nr. 2 row -->
  <text x="30" y="125" fill="#666" font-family="Arial" font-size="10">Nr. 2:</text>
  <circle cx="80" cy="140" r="20" fill="#40826D"/>
  <text x="80" y="145" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">PYPL</text>
  <circle cx="130" cy="140" r="20" fill="#40826D"/>
  <text x="130" y="145" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">YAR</text>
  <circle cx="180" cy="140" r="20" fill="#40826D"/>
  <text x="180" y="145" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">HUSQ</text>
  <circle cx="230" cy="140" r="20" fill="#40826D"/>
  <text x="230" y="145" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">AD</text>
  
  <!-- Nr. 3 row -->
  <text x="30" y="195" fill="#666" font-family="Arial" font-size="10">Nr. 3:</text>
  <circle cx="80" cy="210" r="20" fill="#C9A227"/>
  <text x="80" y="215" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">NKE</text>
  <circle cx="130" cy="210" r="20" fill="#C9A227"/>
  <text x="130" y="215" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">DECK</text>
  <circle cx="180" cy="210" r="20" fill="#C9A227"/>
  <text x="180" y="215" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">BSX</text>
  <circle cx="230" cy="210" r="20" fill="#C9A227"/>
  <text x="230" y="215" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">VOLCAR</text>
  <circle cx="280" cy="210" r="20" fill="#C9A227"/>
  <text x="280" y="215" fill="#0D1B2A" font-family="Arial" font-size="9" text-anchor="middle">MBG</text>
  
  <!-- Summary -->
  <text x="200" y="265" fill="#C9A227" font-family="Arial" font-size="12" text-anchor="middle">4 + 4 + 5 = 13 kandidater introduceret</text>
  <text x="200" y="285" fill="#666" font-family="Arial" font-size="11" text-anchor="middle">LULU invalideret · 9 fra nr.1+2 aktive</text>
</svg>
