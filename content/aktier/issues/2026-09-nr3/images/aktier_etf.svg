<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="30" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ETF'erne: ingen rabat</text>
  <!-- ETF boxes grid -->
  <g transform="translate(30,50)">
    <!-- Row 1: US -->
    <rect x="0" y="0" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="50" y="25" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SPY</text>
    <text x="50" y="45" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">1,2%</text>
    
    <rect x="120" y="0" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="170" y="25" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">VOO</text>
    <text x="170" y="45" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">1,2%</text>
    
    <rect x="240" y="0" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="290" y="25" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">QQQ</text>
    <text x="290" y="45" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">3,9%</text>
    
    <!-- Row 2: EU -->
    <rect x="0" y="80" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="50" y="105" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">EUNL</text>
    <text x="50" y="125" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">1,0%</text>
    
    <rect x="120" y="80" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="170" y="105" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">EXS1</text>
    <text x="170" y="125" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">0,4%</text>
    
    <rect x="240" y="80" width="100" height="60" fill="#40826D" rx="5"/>
    <text x="290" y="105" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">OMXC25</text>
    <text x="290" y="125" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">1,1%</text>
  </g>
  <!-- Conclusion -->
  <rect x="50" y="210" width="300" height="50" fill="#333" rx="5"/>
  <text x="200" y="235" fill="#C9A227" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Konklusion: Ingen ETF i udsalg</text>
  <text x="200" y="252" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Rabat findes kun i enkeltnavn</text>
  <text x="200" y="285" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">Alle ETF'er 04% fra 52w top</text>
</svg>
