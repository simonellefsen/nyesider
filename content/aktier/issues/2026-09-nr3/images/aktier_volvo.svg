<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Swedish flag colors hint -->
  <rect x="60" y="50" width="80" height="80" fill="#005293" stroke="#C9A227" stroke-width="2"/>
  <rect x="95" y="50" width="10" height="80" fill="#FECC00"/>
  <rect x="60" y="85" width="80" height="10" fill="#FECC00"/>
  <!-- Car silhouette simple -->
  <path d="M180,130 L180,100 L220,80 L320,80 L340,100 L340,130 Z" fill="none" stroke="#C9A227" stroke-width="2"/>
  <circle cx="200" cy="130" r="15" fill="none" stroke="#C9A227" stroke-width="2"/>
  <circle cx="320" cy="130" r="15" fill="none" stroke="#C9A227" stroke-width="2"/>
  <!-- Extreme value metrics -->
  <text x="200" y="180" fill="#C9A227" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">SEK 18,86</text>
  <text x="200" y="205" fill="#FF4444" font-family="Arial" font-size="16" text-anchor="middle">48,4% fra top</text>
  <!-- Key metrics - extreme value -->
  <rect x="80" y="225" width="100" height="40" fill="#40826D" rx="5"/>
  <text x="130" y="250" fill="#fff" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">P/E 5,94</text>
  
  <rect x="220" y="225" width="100" height="40" fill="#40826D" rx="5"/>
  <text x="270" y="250" fill="#fff" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">P/B 0,37</text>
  
  <text x="200" y="285" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">SATELLITE · Ekstrem value</text>
</svg>
