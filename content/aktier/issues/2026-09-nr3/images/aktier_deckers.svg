<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Two brand circles -->
  <circle cx="130" cy="120" r="50" fill="none" stroke="#C9A227" stroke-width="3"/>
  <text x="130" y="115" fill="#C9A227" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">HOKA</text>
  <text x="130" y="135" fill="#40826D" font-family="Arial" font-size="12" text-anchor="middle">+26% vækst</text>
  
  <circle cx="270" cy="120" r="50" fill="none" stroke="#C9A227" stroke-width="3"/>
  <text x="270" y="115" fill="#C9A227" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">UGG</text>
  <text x="270" y="135" fill="#40826D" font-family="Arial" font-size="12" text-anchor="middle">+5% vækst</text>
  
  <!-- Price info -->
  <text x="200" y="200" fill="#C9A227" font-family="Arial" font-size="28" text-anchor="middle" font-weight="bold">$85,81</text>
  <text x="200" y="225" fill="#FF4444" font-family="Arial" font-size="16" text-anchor="middle">31,3% fra top</text>
  <!-- Key metrics -->
  <text x="100" y="260" fill="#40826D" font-family="Arial" font-size="14">P/E ~12</text>
  <text x="200" y="260" fill="#40826D" font-family="Arial" font-size="14">P/B ~5</text>
  <text x="300" y="260" fill="#666" font-family="Arial" font-size="12">Tariff-derated</text>
  <text x="200" y="285" fill="#666" font-family="Arial" font-size="10" text-anchor="middle">SATELLITE · Kvalitetsvækst</text>
</svg>
