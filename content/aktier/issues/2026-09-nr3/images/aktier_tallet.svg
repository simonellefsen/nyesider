<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A4B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <text x="200" y="30" fill="#C9A227" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Fem kandidater: % fra 52w top</text>
  <!-- Horizontal bar chart -->
  <g transform="translate(30,50)">
    <!-- BSX -->
    <text x="0" y="15" fill="#fff" font-family="Arial" font-size="12">BSX</text>
    <rect x="60" y="5" width="280" height="20" fill="#333"/>
    <rect x="60" y="5" width="158" height="20" fill="#C9A227"/>
    <text x="345" y="20" fill="#C9A227" font-family="Arial" font-size="11">56%</text>
    
    <!-- NKE -->
    <text x="0" y="55" fill="#fff" font-family="Arial" font-size="12">NKE</text>
    <rect x="60" y="45" width="280" height="20" fill="#333"/>
    <rect x="60" y="45" width="140" height="20" fill="#C9A227"/>
    <text x="345" y="60" fill="#C9A227" font-family="Arial" font-size="11">50%</text>
    
    <!-- VOLCAR -->
    <text x="0" y="95" fill="#fff" font-family="Arial" font-size="12">VOLCAR</text>
