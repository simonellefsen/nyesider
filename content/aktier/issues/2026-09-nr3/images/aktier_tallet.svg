    <rect x="60" y="125" width="280" height="20" fill="#333"/>
    <rect x="60" y="125" width="87" height="20" fill="#C9A227"/>
    <text x="345" y="140" fill="#C9A227" font-family="Arial" font-size="11">31%</text>
    
    <!-- MBG -->
