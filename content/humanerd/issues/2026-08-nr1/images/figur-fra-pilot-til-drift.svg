<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Fra annonce til drift</title><desc id="desc">Fire trin fra annonce over feltvalidering og integration til dokumenteret drift.</desc><rect width="1200" height="520" fill="#16172C"/><text x="70" y="80" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700">Fra annonce til drift</text><text x="70" y="120" fill="#B8C6D9" font-family="Arial, sans-serif" font-size="22">Spørg efter opgave, sted, tidsrum, fejl og menneskelig overvågning</text><g font-family="Arial, sans-serif"><path d="M220 305H980" stroke="#63E6BE" stroke-width="8"/><path d="M980 305l-28-18v36z" fill="#63E6BE"/><g><circle cx="210" cy="305" r="58" fill="#FFB55B"/><text x="210" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#16172C">1</text><text x="210" y="405" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Annonce</text><text x="210" y="438" text-anchor="middle" font-size="20" fill="#B8C6D9">Hensigt og video</text></g><g><circle cx="460" cy="305" r="58" fill="#63E6BE"/><text x="460" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#16172C">2</text><text x="460" y="405" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Feltvalidering</text><text x="460" y="438" text-anchor="middle" font-size="20" fill="#B8C6D9">Afgrænset, rigtigt sted</text></g><g><circle cx="710" cy="305" r="58" fill="#63E6BE"/><text x="710" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#16172C">3</text><text x="710" y="405" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Integration</text><text x="710" y="438" text-anchor="middle" font-size="20" fill="#B8C6D9">Zoner, data, stop, service</text></g><g><circle cx="960" cy="305" r="58" fill="#63E6BE"/><text x="960" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#16172C">4</text><text x="960" y="405" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Dokumenteret drift</text><text x="960" y="438" text-anchor="middle" font-size="20" fill="#B8C6D9">Tid, opgave, resultat</text></g></g></svg>
