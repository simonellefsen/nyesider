<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Robot-AI i fem lag</title><desc id="desc">Fem sammenhængende lag: perception, simulation, opgaveplan, bevægelse og sikkerhed.</desc><rect width="1200" height="680" fill="#16172C"/><text x="70" y="82" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700">Robot-AI i fem lag</text><text x="70" y="121" fill="#B8C6D9" font-family="Arial, sans-serif" font-size="22">Ikke én hjerne — en kæde fra sensor til sikker stopfunktion</text><g font-family="Arial, sans-serif" font-weight="700"><g><rect x="70" y="180" width="1060" height="70" rx="18" fill="#2B3155"/><text x="105" y="225" fill="#63E6BE" font-size="28">1 · Perception</text><text x="420" y="225" fill="#FFFFFF" font-size="24">kamera, dybde, kraft, berøring</text></g><g><rect x="70" y="270" width="1060" height="70" rx="18" fill="#313A63"/><text x="105" y="315" fill="#63E6BE" font-size="28">2 · Simulation</text><text x="420" y="315" fill="#FFFFFF" font-size="24">øvelse, syntetiske data, digital tvilling</text></g><g><rect x="70" y="360" width="1060" height="70" rx="18" fill="#38436E"/><text x="105" y="405" fill="#63E6BE" font-size="28">3 · Opgaveplan</text><text x="420" y="405" fill="#FFFFFF" font-size="24">rækkefølge, mål, undtagelser</text></g><g><rect x="70" y="450" width="1060" height="70" rx="18" fill="#414D79"/><text x="105" y="495" fill="#FFB55B" font-size="28">4 · Bevægelse</text><text x="420" y="495" fill="#FFFFFF" font-size="24">led, grib, balance, kraft</text></g><g><rect x="70" y="540" width="1060" height="70" rx="18" fill="#4A5785"/><text x="105" y="585" fill="#FFB55B" font-size="28">5 · Sikkerhed</text><text x="420" y="585" fill="#FFFFFF" font-size="24">grænser, overvågning, nødstop</text></g></g></svg>
